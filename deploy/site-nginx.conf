# PrizzeQuizz — serving the marketing site BESIDE the game.
#
# The important property of this file: the game's own locations come FIRST and
# are matched exactly, so nothing about putting the site up can change how the
# game, the API or the admin panel are served. The site is the fallback for
# everything else.
#
# Paste these blocks into the existing `server { }` for the domain. Do not
# replace the file — the certificate, HTTP/2 and eNamad lines already in there
# should stay exactly as they are.

# ── 1) THE GAME. Highest priority, unchanged. ────────────────────────────────
# `=` is an exact match and beats every prefix and regex location in nginx, so
# the game keeps the root no matter what the site does below.
location = / {
    root /var/www/prizequiz;
    try_files /index.html =404;
}

# The game under a real path too, so the site's «بازی کن» buttons have
# somewhere to point that is not the root. Set the same value in the panel at
# /site-admin → «نشانی بازی».
location = /play {
    root /var/www/prizequiz;
    try_files /index.html =404;
}

location = /pzadmin.html {
    root /var/www/prizequiz;
}

# The game API. Untouched.
location /v1/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;          # the duel WebSocket
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── THE SITE'S OWN FILES. MUST COME BEFORE THE STATIC REGEX BELOW. ──────────
#
# `^~` is not decoration. When a `^~` prefix location is the longest matching
# prefix, nginx STOPS and never evaluates any regex location at all. Without it,
# /site-assets/vazirmatn.woff2 and /site-assets/char-hero.png are caught by the
# `\.(png|…|woff2?|…)$` block below — or, worse, by a static-file block that was
# already in your server{} before the site existed and has no fallback — and
# they 404 while /site-assets/pq.css works, because `css` is not in that list.
#
# That is the exact failure this block exists to prevent: the stylesheet loads,
# the font and every character silently do not, and the site looks like a
# different design rather than a broken one.
location ^~ /site-assets/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The site already sends a strong ETag and a long max-age of its own.
}

# Static assets the game loads (character art, icons, the eNamad file).
location ~* \.(png|jpe?g|webp|avif|svg|ico|gif|woff2?|mp3|txt|html)$ {
    root /var/www/prizequiz;
    try_files $uri @site;                            # not a game file → try the site
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# ── 2) THE SITE. Everything else. ────────────────────────────────────────────
location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    # If the site process is down the game is unaffected; visitors to a
    # marketing page see nginx's error page rather than a hung request.
    proxy_next_upstream error timeout http_502 http_503 http_504;
}

location @site {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── NOTE ON THE ROOT ─────────────────────────────────────────────────────────
# As written, `/` is the GAME and the marketing home is reachable at /home.
# That is the SAFE default: no existing link, bookmark or installed shortcut
# changes behaviour.
#
# For SEO the marketing home really wants to be the root. When you are ready,
# swap it: delete the `location = /` block above, and the site takes the root
# automatically (it already serves 'home' there). The game stays at /play, so
# tell people once and update the shortcut. Do this as its own change, on a
# quiet day — not together with the first deploy of the site.
