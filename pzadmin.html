<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrizzeQuizz — پنل مدیریت</title>
<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d2230;--line:#2a3040;--ink:#e7ecf3;--muted:#8b94a7;--gold:#ffd21f;--ok:#33d97c;--bad:#ff5a48;--info:#5db7ec;--accent:#7b8bff;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,system-ui,sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:#0c0f16;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 10px;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{width:auto}
.hidden{display:none!important}
.btn{border:1.5px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);padding:8px 13px;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:linear-gradient(180deg,#ffe24a,#f5b90d);color:#1a1400;border-color:#000}
.btn.ok{background:var(--ok);color:#062611;border-color:#000}.btn.bad{background:var(--bad);color:#2a0500;border-color:#000}.btn.info{background:var(--info);color:#03202f;border-color:#000}
.btn.sm{padding:5px 8px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.45}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:30px;width:100%;max-width:400px}
.login-card h1{margin:0 0 4px;font-size:22px}.login-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
#shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--panel);border-left:1.5px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.brand{font-size:16px;font-weight:900;padding:6px 10px 12px}.brand small{color:var(--muted);font-weight:600;font-size:10px;display:block}
.navgroup{font-size:10px;color:var(--muted);font-weight:800;padding:12px 10px 5px;letter-spacing:.5px}
.nav button{display:flex;align-items:center;gap:9px;text-align:right;background:none;border:none;color:var(--muted);padding:8px 10px;border-radius:8px;font-size:13px;font-weight:700;width:100%}
.nav button.active{background:var(--panel2);color:var(--ink)}
.nav button:hover{color:var(--ink)}
.nav .ico{width:18px;text-align:center}
/* «چه چیزِ تازه‌ای آمده» — the same count on the sidebar row, on the subtab
   inside it, and on the row itself, so it can be followed all the way in. */
.pzb{margin-inline-start:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad,#e5484d);color:#fff;font-size:10.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none}
.subtabs button .pzb{margin-inline-start:6px;transform:translateY(-1px)}
.subtabs button.active .pzb{background:#1a1400;color:var(--gold)}
.pz-new{display:inline-block;background:var(--bad,#e5484d);color:#fff;font-size:9.5px;font-weight:900;border-radius:5px;padding:1px 5px;margin-inline-start:6px;vertical-align:middle}
main{padding:22px 24px;overflow:auto;max-height:100vh}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:19px}.head .sub{color:var(--muted);font-size:12px;margin-top:2px}
.grid{display:grid;gap:13px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){#shell{grid-template-columns:1fr}aside{position:static;height:auto}.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:15px}
.card h3{margin:0 0 11px;font-size:14.5px}
.stat{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:var(--r);padding:15px}
.stat .k{color:var(--muted);font-size:11.5px;font-weight:700}.stat .v{font-size:23px;font-weight:900;margin-top:5px}
.v.gold{color:var(--gold)}.v.ok{color:var(--ok)}.v.bad{color:var(--bad)}.v.info{color:var(--info)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:11px;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow:auto;border-radius:10px;border:1.5px solid var(--line);max-height:62vh}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:800;border:1.5px solid #000}
.pill.pend{background:#3a3320;color:#ffd67a}.pill.ok{background:#0f3323;color:#5cffa8}.pill.bad{background:#3a1512;color:#ff8f82}.pill.info{background:#0e2c3d;color:#8fd6ff}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:140px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;bottom:30px}.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--muted);font-weight:700}
.note{background:rgba(123,139,255,.1);border:1.5px solid rgba(123,139,255,.3);border-radius:10px;padding:11px 13px;font-size:12px;color:#b9c2ff;margin-bottom:14px;line-height:1.7}
.cfg-row{display:grid;grid-template-columns:1fr 180px;gap:10px;align-items:center;margin-bottom:7px;padding:5px 0;border-bottom:1px dashed var(--line)}
/* Topic artwork tile in the categories editor: an empty dashed square invites a
   click, a filled one shows the picture with a corner button to clear it. */
.cat-art{position:relative;width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;background:var(--panel2);border:2px dashed var(--line);transition:border-color .12s,transform .12s}
.cat-art:hover{border-color:var(--accent);transform:translateY(-1px)}
.cat-art.has{border-style:solid;border-color:var(--line)}
.cat-art img{width:100%;height:100%;object-fit:cover;display:block}
.cat-art>span{font-size:22px;color:var(--muted);font-weight:800;line-height:1}
.cat-art-x{position:absolute;top:2px;left:2px;width:18px;height:18px;border:0;border-radius:50%;cursor:pointer;
  background:rgba(0,0,0,.66);color:#fff;font-size:11px;line-height:18px;padding:0;text-align:center}
.cfg-row label{font-size:12.5px;color:var(--ink)}.cfg-row .path{font-size:10px;color:var(--muted);direction:ltr;text-align:right;display:block}
textarea.json{min-height:300px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;white-space:pre;direction:ltr;text-align:left}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;padding:14px}
.modal{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
.skel{height:48px;border-radius:9px;margin-bottom:8px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700}
.subtabs button.active{background:var(--gold);color:#1a1400;border-color:#000}
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <h1>⚡ پنل مدیریت</h1><p>PrizzeQuizz — کنترل کامل و Data-Driven</p>
    <div class="field"><label>آدرس API</label><input id="inApi" placeholder="https://دامنه/v1" dir="ltr"></div>
    <div class="field"><label>نام کاربری</label><input id="inUser" placeholder="owner" dir="ltr" autocomplete="username"></div>
    <div class="field"><label>رمز عبور</label><input id="inPass" type="password" placeholder="••••••••" dir="ltr" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn pri" style="width:100%;margin-top:6px" onclick="doLogin()">ورود</button>
    <div style="text-align:center;margin-top:10px"><a onclick="document.getElementById('keyWrap').style.display='block';this.style.display='none'" style="color:var(--muted);font-size:12px;cursor:pointer">ورود با کلید اصلی (پیشرفته)</a></div>
    <div class="field" id="keyWrap" style="display:none;margin-top:8px"><label>کلید اصلی (ADMIN_KEY)</label><input id="inKey" type="password" placeholder="ADMIN_KEY" dir="ltr"></div>
    <p id="loginErr" style="color:var(--bad);margin:12px 0 0;font-size:12px"></p>
    <p style="color:var(--muted);font-size:11px;margin-top:10px">اولین ورود: نام کاربری <b>owner</b> و رمز = همان کلید اصلیِ سرور. بعد از ورود می‌توانی رمز را عوض کنی و برای دیگران حساب بسازی.</p>
  </div>
</section>

<section id="shell" class="hidden">
  <aside>
    <div class="brand">⚡ Prizze Admin<small id="cfgVer"></small></div>
    <nav class="nav" id="nav"></nav>
    <div id="pzbStatus"></div>
    <button class="btn" style="width:100%;margin-top:14px;color:var(--bad)" onclick="logout()">خروج</button>
    <!-- Which panel file is actually loaded. "The panel did not update" has
         been the report several times, and a cached HTML looks identical to a
         broken feature; this is how to tell them apart in one glance. -->
    <div id="pzBuild" style="text-align:center;font-size:9.5px;color:var(--muted);margin-top:8px;letter-spacing:.3px"></div>
  </aside>
  <main id="main"></main>
</section>
<div class="toast" id="toast"></div>

<script>
let API=localStorage.getItem('pz_admin_api')||(location.origin+'/v1');
let KEY=localStorage.getItem('pz_admin_key')||'';
let CFG=null;
const $=(s,r=document)=>r.querySelector(s);
function fa(n){return (Number(n)||0).toLocaleString('fa-IR');}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');clearTimeout(toast._t);toast._t=setTimeout(()=>e.className='toast',2800);}
function fmtDate(d){if(!d)return '—';try{return new Date(d).toLocaleString('fa-IR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
async function api(method,path,body){
  const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json','x-admin-key':KEY},body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json();}catch(e){}
  if(r.status===403)throw (d&&d.error)||{code:'FORBIDDEN',message:'دسترسی مجاز نیست'};
  if(!r.ok)throw (d&&d.error)||{message:'خطای '+r.status};
  return d&&d.data!==undefined?d.data:d;
}
let PERMS=['*'], IS_OWNER=true, ME_USER='';
function canTab(k){
  if(PERMS.indexOf('*')>=0) return true;
  /* A merged nav row opens when any one of its screens is permitted; the
     screens themselves are still checked one by one. */
  if(typeof TAB_GROUPS!=='undefined' && TAB_GROUPS[k]) return TAB_GROUPS[k].tabs.some(t=>PERMS.indexOf(t[0])>=0);
  return PERMS.indexOf(k)>=0;
}
async function doLogin(){
  API=($('#inApi').value||'').trim().replace(/\/$/,'')||API;
  const key=($('#inKey')&&$('#inKey').value||'').trim();
  const user=($('#inUser').value||'').trim(), pass=($('#inPass').value||'');
  $('#loginErr').textContent='';
  try{
    if(key){ KEY=key; }                         // advanced: direct master key
    else {
      if(!user||!pass){$('#loginErr').textContent='نام کاربری و رمز را وارد کن';return;}
      const r=await fetch(API+'/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
      const d=await r.json().catch(()=>null);
      if(!r.ok){$('#loginErr').textContent=(d&&d.error&&d.error.message)||'ورود ناموفق';return;}
      KEY=(d&&d.data&&d.data.token)||(d&&d.token);
    }
    localStorage.setItem('pz_admin_api',API);localStorage.setItem('pz_admin_key',KEY);
    await enterPanel();
  }catch(e){$('#loginErr').textContent=e.message||'ورود ناموفق';}
}
async function enterPanel(){
  try{ await loadMe(); }catch(e){ showLogin((e&&e.message)||'نشست منقضی شده؛ دوباره وارد شو'); return false; }
  $('#login').classList.add('hidden');$('#shell').classList.remove('hidden');
  await loadCfg(); buildNav();
  await badgeStart();          // counts first, so the first screen opens with them
  // land on the first tab this account may actually see
  const first=(NAV.flatMap(g=>g[1]).map(p=>p[0]).filter(canTab))[0]||'dashboard';
  go(canTab('dashboard')?'dashboard':first);
  return true;
}
function showLogin(msg){ $('#shell').classList.add('hidden'); $('#login').classList.remove('hidden'); if(msg)$('#loginErr').textContent=msg; }
async function loadMe(){ const me=await api('GET','/admin/auth/me'); PERMS=me.perms||['*']; IS_OWNER=!!me.isOwner; ME_USER=me.username||''; }
function logout(){localStorage.removeItem('pz_admin_key');location.reload();}
async function loadCfg(){ try{ CFG=await api('GET','/admin/config'); $('#cfgVer').textContent='config '+(CFG.version||''); }catch(e){ CFG={}; } }

/* ---- nav: 25 sections grouped ---- */
/* ---- Merged tabs ----
   Fifty-one entries in the sidebar, and several of them were one job split
   across four rows: a payout was «دریافت جایزه» + «جوایز در انتظار» +
   «شرکای جایزه» + «کد تأیید», each a separate scroll away from the others.
   A group is ONE nav entry whose screens sit behind a row of subtabs.

   CUR still holds the individual screen's key, never the group's. That keeps
   everything that already reads it working unchanged — the permission check,
   CONFIG_PAGES, `if(CUR==='questions')`, `go('pipeline')` from another screen
   — and it keeps the permission unit per-screen, so an account granted
   'withdrawals' and nothing else still sees exactly that one subtab. */
const TAB_GROUPS={
  g_money:   {icon:'💰',label:'مالی و حسابداری',tabs:[['finance','داشبورد مالی'],['accounting','حسابداری و گزارش'],['expenses','هزینه‌های شرکت']]},
  g_qhub:    {icon:'❓',label:'سوالات',tabs:[['questions','بانک سوال'],['qreports','گزارش سؤالات'],['aistudio','استودیوی AI'],['pipeline','خط‌لولهٔ کیفیت']]},
  g_chars:   {icon:'🎭',label:'کاراکترها',tabs:[['characters','کاراکترها'],['charboxes','قرعه‌کشی کاراکتر']]},
  g_payout:  {icon:'💸',label:'دریافت جایزه',tabs:[['withdrawals','درخواست‌ها'],['rewardholds','جوایز در انتظار'],['payoutpartners','شرکای جایزه'],['withdrawotp','کد تأیید']]},
  g_balance: {icon:'⚖️',label:'بالانس بازی',tabs:[['cfg_xp','XP'],['cfg_level','Level'],['cfg_cup','Cup'],['cfg_gameplay','گیم‌پلی مودها']]},
  g_sms:     {icon:'📱',label:'پنل پیامکی',tabs:[['sms','ارسال و تنظیمات'],['smsgroups','گروه‌های شماره']]},
  g_security:{icon:'🛡️',label:'امنیت و ضدتقلب',tabs:[['anticheat','تنظیمات ضدتقلب'],['suspicious','کاربران مشکوک']]},
  g_audit:   {icon:'📑',label:'گزارش و لاگ',tabs:[['reports','گزارش‌ها'],['logs','لاگ و Audit']]}
};
/* screen key → the group that carries it */
const TAB_GROUP_OF={};
Object.keys(TAB_GROUPS).forEach(g=>TAB_GROUPS[g].tabs.forEach(t=>{TAB_GROUP_OF[t[0]]=g;}));
function groupMembers(g){ return (TAB_GROUPS[g]?TAB_GROUPS[g].tabs:[]).filter(t=>canTab(t[0])); }

const NAV=[
  ['اصلی',[['dashboard','📊','داشبورد'],['g_money','💰','مالی و حسابداری'],['users','👤','کاربران'],['matches','🎮','مسابقات'],['lastsurvivor','🏆','آخرین بازمانده'],['support','🎧','پشتیبانی']]],
  ['محتوا',[['g_qhub','❓','سوالات'],['categories','🏷️','موضوعات'],['g_chars','🎭','کاراکترها'],['lifelines','🧩','کمک‌ها'],['rewards','🎡','گردونه و جایزه روزانه'],['recordmode','🏅','ثبت رکورد'],['onboarding','👋','خوش‌آمدگویی']]],
  ['اقتصاد',[['wallet','🏆','صندوق جایزه'],['g_payout','💸','دریافت جایزه'],['tickets','🎫','بلیط‌ها'],['shop','🛒','فروشگاه'],['chatpacks','💬','پک‌های چت'],['giftcodes','🎁','کدهای هدیه'],['payments','🏦','درگاه پرداخت']]],
  ['بالانس بازی (Data-Driven)',[['g_balance','⚖️','بالانس بازی'],['leagues','🛡️','لیگ‌ها'],['missions2','🎯','مأموریت‌ها']]],
  ['رشد و تعامل',[['leaderboard','📈','لیدربرد'],['campaign','🎁','کمپین کاربر جدید'],['events','📅','رویدادها'],['banners','🖼️','بنرها'],['notifications','🔔','اعلان‌ها'],['g_sms','📱','پنل پیامکی']]],
  ['سیستم',[['monitoring','🖥️','مانیتورینگ سرور'],['g_security','🛡️','امنیت و ضدتقلب'],['g_audit','📑','گزارش و لاگ'],['reset','♻️','ابزار ریست'],['accounts','🔐','حساب‌ها و دسترسی'],['backup','💾','پشتیبان‌گیری'],['general','⚙️','تنظیمات عمومی'],['rawcfg','🧩','ویرایش خام Config']]]
];
/* NAV with every group opened out into its screens — for anything that has to
   speak in screens rather than nav rows (the access checklist, tab labels). */
function navLeaves(){
  const out=[];
  NAV.forEach(g=>g[1].forEach(p=>{
    if(TAB_GROUPS[p[0]]) TAB_GROUPS[p[0]].tabs.forEach(t=>out.push([t[0],TAB_GROUPS[p[0]].icon,t[1],g[0]]));
    else out.push([p[0],p[1],p[2],g[0]]);
  }));
  return out;
}
/* ---- What is new, and where ----
   A payout request or a support ticket arrives and nothing on the panel moves,
   so the only way to find one was to open every tab. The server counts what is
   waiting per screen; this carries the number all the way in — the sidebar
   row, the subtab inside it, then the row in the table.

   Two kinds, and the difference matters: a QUEUE (pending payouts, open
   tickets) clears when the work is done, never because somebody looked at the
   tab; a NEW count (money movements, signups) is about arrival, so opening the
   screen is what clears it. The server decides which is which. */
let PZB={screens:{},total:0};      // what the server says is waiting
const PZB_SINCE={};                // screen → when THIS admin last looked (for row tags)
let PZB_TIMER=null, PZB_ERR='';    // why the counts are missing, if they are

function badgeFor(key){
  /* A merged row carries the sum of the screens behind it — otherwise a
     payout sitting under «دریافت جایزه» would be invisible until the row was
     opened, which is the problem this is meant to solve. */
  if(TAB_GROUPS[key]) return groupMembers(key).reduce((n,t)=>n+badgeFor(t[0]),0);
  const b=PZB.screens[key];
  return b&&b.count>0?b.count:0;
}
function badgeHTML(key){
  const n=badgeFor(key);
  return n>0?'<span class="pzb">'+fa(n>99?'99+':n)+'</span>':'';
}
/* Which build this file is. Shown in the sidebar because "the panel did not
   update" has been the report more than once, and a cached HTML file looks
   exactly like a feature that does not work. */
const PANEL_BUILD='2026-08-12 · badges';
async function badgeLoad(){
  try{
    const d=await api('GET','/admin/badges');
    if(d&&d.screens){ PZB=d; PZB_ERR=''; buildNav(); paintGroupBar(); }
  }catch(e){
    /* A badge is decoration and must never break the panel — but failing in
       COMPLETE silence is why "the badges do not work" was impossible to tell
       apart from "the backend is still the old one". So it says which. */
    PZB_ERR=(e&&e.message)?e.message:'در دسترس نیست';
  }
  badgeStatus();
}
function badgeStatus(){
  const el=$('#pzbStatus'); if(!el)return;
  el.innerHTML=(PZB_ERR

/* Tell the server this admin has now looked, and keep the PREVIOUS mark: rows
   newer than it are what they have not seen, and get a «جدید» tag. */
async function badgeSeen(screen){
  try{
    const r=await api('POST','/admin/badges/seen',{screen});
    if(r&&'previous' in r) PZB_SINCE[screen]=r.previous||null;
  }catch(e){ /* ignore */ }
}
/** «جدید» for a row that arrived since this admin last opened the screen. */
function newTag(screen,at){
  const since=PZB_SINCE[screen];
  if(!since||!at)return '';
  return (new Date(at).getTime()>new Date(since).getTime())?'<span class="pz-new">جدید</span>':'';
}

/* 'banners' was a raw-config page: render() checks CONFIG_PAGES BEFORE the
   renderer map, so it swallowed the real banners screen and drew a config
   editor for a key that carries nothing. That is why the tab "showed

   users + recent signals) sat behind a raw-config editor for the antiCheat
   key, so the built screen could never run. Only one of the two is kept. */
const CONFIG_PAGES={cfg_xp:['xp','تنظیمات XP'],cfg_level:['level','تنظیمات Level'],cfg_cup:['cup','تنظیمات Cup'],cfg_gameplay:['gameplay','گیم‌پلی هر مود'],events:['events','رویدادها'],general:['general','تنظیمات عمومی'],campaign:['campaign','کمپین کاربر جدید']};

async function render(){
  loading();

  if(CUR==='accounts'){ if(!IS_OWNER){$('#main').innerHTML=head('دسترسی محدود')+'<div class="card empty">فقط مدیر کل به این بخش دسترسی دارد.</div>';return;} }
  else if(!canTab(CUR)){ $('#main').innerHTML=head('دسترسی محدود')+'<div class="card empty">به این بخش دسترسی نداری. از مدیر کل بخواه دسترسی این تب را فعال کند.</div>';return; }
  /* Mark the screen seen BEFORE it draws — the rows need to know when this
     admin last looked, so the ones that arrived since can say «جدید». Doing it
     afterwards would move the mark past them and tag nothing. */
  const tracked=!!PZB.screens[CUR];
  if(tracked) await badgeSeen(CUR);
  try{
    if(CUR==='accounts')return renderAccounts();
    if(CONFIG_PAGES[CUR]){ await renderConfigSection(CONFIG_PAGES[CUR][0],CONFIG_PAGES[CUR][1]); groupBar(); if(tracked)void badgeLoad(); return; }
    const fn={dashboard:renderDashboard,finance:renderFinance,accounting:renderAccounting,expenses:renderExpenses,backup:renderBackup,users:renderUsers,matches:renderMatches,support:renderSupport,questions:renderQuestions,leagues:renderLeagues,qreports:renderQReports,aistudio:renderAiStudio,pipeline:renderPipeline,categories:renderCategories,wallet:renderWallet,withdrawals:renderWithdrawals,payoutpartners:renderPayoutPartners,withdrawotp:renderWithdrawOtp,smsgroups:renderSmsGroups,rewardholds:renderRewardHolds,tickets:renderTickets,giftcodes:renderGiftCodes,shop:renderShopAdmin,chatpacks:renderChatPacks,characters:renderCharacters,charboxes:renderCharBoxes,lifelines:renderLifelines,rewards:renderRewards,missions2:renderMissions2,recordmode:renderRecordMode,onboarding:renderOnboarding,lastsurvivor:renderLastSurvivor,sms:renderSms,payments:renderPayments,leaderboard:renderLeaderboard,banners:renderBanners,notifications:renderNotifications,anticheat:renderAntiCheat,suspicious:renderSuspicious,reports:renderReports,logs:renderLogs,reset:renderReset,roles:renderRoles,rawcfg:renderRawCfg,monitoring:renderMonitoring}[CUR];
    if(fn){ await fn(); groupBar(); if(tracked)void badgeLoad(); return; }
    /* No renderer for this tab. Six nav entries were in this state, and
       clicking one silently left the PREVIOUS screen's content on display —
       which is indistinguishable from a section having disappeared. Say so. */
    $('#main').innerHTML=head('در دست ساخت')+

    return;
  }catch(e){$('#main').innerHTML=head('خطا')+'<div class="card empty">'+(e.message||'خطا')+'</div>';}
}

    return '<div onclick="toast(\''+esc(day)+' — '+fa(v)+' '+esc(label||'')+'\',\'ok\')" title="'+esc(day)+': '+fa(v)+'" style="display:inline-block;width:'+w+'px;height:'+h+'px;background:'+color+';border-radius:3px 3px 0 0;margin-left:1px;vertical-align:bottom;cursor:pointer" onmouseover="this.style.filter=\'brightness(1.3)\'" onmouseout="this.style.filter=\'\'"></div>';}).join('');

async function dashLoadServers(){

  const g=function(label,val,unit,pct,color){

        '<path d="M11 48 A34 34 0 0 1 79 48" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9" stroke-linecap="round"/>'+
        '<path d="M11 48 A34 34 0 0 1 79 48" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+dash+' '+C+'"/>'+
        '<text x="45" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">'+fa(Math.round(p))+'٪</text>'+

    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><h3 style="margin:0">\u{1F5A5}️ وضعیت سرورها</h3>'+

      '<button class="btn sm" onclick="dashLoadServers()">↻</button></div>'+

      const memPct=m.memTotal?Math.round((m.memUsed/m.memTotal)*100):0;

            g('CPU',null,null,m.cpuPercent,'#5db7ec')+
            g('RAM',monBytes(m.memUsed),'',memPct,'#2ecc71')+
            g('دیسک',monBytes(m.diskUsed),'',dskPct,'#f39c12')+

          :'<div class="sub">هنوز گزارشی از این سرور نرسیده</div>')+

let ACC_FROM='', ACC_TO='', ACC_GRAN='day';
function accDefaults(){
  if(ACC_FROM&&ACC_TO)return;
  const d=new Date(); ACC_TO=d.toISOString().slice(0,10);
  ACC_FROM=new Date(Date.now()-29*86400000).toISOString().slice(0,10);
}
/** Jump the range to today / this week / this month without typing dates. */
function accPreset(kind){
  const now=new Date(), iso=x=>x.toISOString().slice(0,10);
  if(kind==='day'){ ACC_FROM=ACC_TO=iso(now); ACC_GRAN='day'; }
  else if(kind==='week'){ const d=(now.getUTCDay()+6)%7; ACC_FROM=iso(new Date(Date.now()-d*86400000)); ACC_TO=iso(now); ACC_GRAN='day'; }
  else { ACC_FROM=iso(new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1))); ACC_TO=iso(now); ACC_GRAN='day'; }
  render();
}
function accApply(){
  ACC_FROM=document.getElementById('acc_from').value||ACC_FROM;
  ACC_TO=document.getElementById('acc_to').value||ACC_TO;
  ACC_GRAN=document.getElementById('acc_gran').value||'day';
  render();
}
function accQuery(){ return 'from='+encodeURIComponent(ACC_FROM)+'&to='+encodeURIComponent(ACC_TO)+'&granularity='+encodeURIComponent(ACC_GRAN); }
/** Downloads go through fetch so the admin key travels in the header. */
async function accDownload(fmt){
  try{

    if(!res.ok){ toast('خروجی گرفته نشد ('+res.status+')'); return; }

    a.href=url; a.download='finance-'+ACC_FROM+'_'+ACC_TO+'.'+fmt; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);

  }catch(e){ toast('خروجی گرفته نشد'); }
}
/* A plain read-only bar chart: income / payouts / expenses per bucket. */
function accChart(series){
  if(!series||!series.length) return '<div class="card empty">در این بازه تراکنشی ثبت نشده</div>';
  const max=Math.max(1,...series.map(s=>Math.max(s.income,s.payouts+s.expenses)));
  const w=Math.max(10,Math.floor(680/series.length)-6);
  const bars=series.map(s=>{
    const h=v=>Math.round((v/max)*120);
    return '<div style="display:inline-flex;flex-direction:column-reverse;align-items:center;gap:2px;margin-left:4px;vertical-align:bottom" title="'+esc(s.bucket)+'">'+
      '<div style="font-size:9px;color:var(--sub);white-space:nowrap;transform:rotate(-45deg);transform-origin:top left;height:26px">'+esc(s.bucket.slice(-5))+'</div>'+
      '<div style="display:flex;align-items:flex-end;gap:2px">'+
        '<div style="width:'+w+'px;height:'+h(s.income)+'px;background:#2ecc71;border-radius:3px 3px 0 0"></div>'+
        '<div style="width:'+w+'px;height:'+h(s.payouts)+'px;background:#e74c3c;border-radius:3px 3px 0 0"></div>'+
        '<div style="width:'+w+'px;height:'+h(s.expenses)+'px;background:#f39c12;border-radius:3px 3px 0 0"></div>'+
      '</div></div>';
  }).join('');
  return '<div style="overflow-x:auto;direction:ltr;text-align:left;padding:8px 0 30px">'+bars+'</div>'+
    '<div style="font-size:11px;color:var(--sub);display:flex;gap:14px;justify-content:center">'+
      '<span><i style="display:inline-block;width:10px;height:10px;background:#2ecc71;border-radius:2px"></i> درآمد</span>'+
      '<span><i style="display:inline-block;width:10px;height:10px;background:#e74c3c;border-radius:2px"></i> پرداختی به بازیکن</span>'+
      '<span><i style="display:inline-block;width:10px;height:10px;background:#f39c12;border-radius:2px"></i> هزینه</span></div>';
}

async function backupDownload(){
  const btn=document.getElementById('bk_btn'); const t=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='در حال آماده‌سازی…'; }
  try{
    const res=await fetch(API+'/admin/backup/export',{headers:{'x-admin-key':KEY}});
    if(!res.ok){ toast('پشتیبان گرفته نشد ('+res.status+')'); return; }
    const blob=await res.blob(), url=URL.createObjectURL(blob), a=document.createElement('a');
    const cd=res.headers.get('content-disposition')||'';
    const m=cd.match(/filename="([^"]+)"/);
    a.href=url; a.download=m?m[1]:'prizzequizz-backup.json'; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('پشتیبان دانلود شد ✅ ('+Math.round(blob.size/1024)+' کیلوبایت)');
  }catch(e){ toast('پشتیبان گرفته نشد'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=t; } }
}

function uBulkBar(){

    '</div></div>':'';

async function uBulk(action){
  const ids=[..._USEL]; if(!ids.length)return;
  const users=(window._UALL||[]);
  let amount=0,tier='green',msg='';
  if(action.startsWith('wallet')){amount=Number(prompt('مبلغِ '+(action==='wallet_add'?'افزودن':'کسر')+' به تومان:','50000'));if(!amount)return;if(action==='wallet_sub')amount=-Math.abs(amount);else amount=Math.abs(amount);}
  if(action.startsWith('ticket')){tier=prompt('نوع بلیط (green/blue/red/bronze/silver/gold):','green')||'green';const cnt=Number(prompt('تعداد:','1'));if(!cnt)return;amount=action==='ticket_sub'?-Math.abs(cnt):Math.abs(cnt);}
  if(action.startsWith('xp')){const x=Number(prompt('مقدارِ XP:','100'));if(!x)return;amount=action==='xp_sub'?-Math.abs(x):Math.abs(x);}
  if(action==='notify'){msg=prompt('متنِ اعلان به کاربران:');if(!msg)return;}
  if((action==='ban'||action==='unban')&&!confirm((action==='ban'?'بن':'آن‌بن')+' '+ids.length+' کاربر؟'))return;
  const reason=action.startsWith('wallet')?(prompt('علتِ اصلاحِ موجودی:')||'عملیات گروهی'):'';
  let ok=0,bad=0;
  for(const uid of ids){try{
    if(action.startsWith('wallet'))await api('POST','/admin/wallet/adjust',{userId:uid,amount,reason});
    else if(action.startsWith('ticket'))await api('POST','/admin/users/'+uid+'/tickets',{tier,count:amount,mode:'add'});
    else if(action.startsWith('xp')){const u=users.find(x=>x.id===uid)||{};await api('PATCH','/admin/users/'+uid,{xp:Math.max(0,(Number(u.xp)||0)+amount)});}
    else if(action==='notify')await api('POST','/admin/users/'+uid+'/message',{title:'پیام از پشتیبانی',body:msg});
    else if(action==='ban')await api('PATCH','/admin/users/'+uid+'/status',{status:'banned',reason:'عملیات گروهی'});
    else if(action==='unban')await api('PATCH','/admin/users/'+uid+'/status',{status:'active',reason:''});
    ok++;
  }catch(e){bad++;}}
  _USEL.clear();toast('انجام شد: '+fa(ok)+(bad?' · ناموفق '+fa(bad):''),bad?'bad':'ok');render();
}

async function qLoadStats(force){

function lgReadTiers(){

    label:tr.querySelector('.lg_lbl').value.trim(),

    prizeType:tr.querySelector('.lg_type').value
  }));
}
async function lgSave(){
  const tiers=lgReadTiers();
  /* Overlapping bands would put one rank in two leagues and hand out two
     tickets; a gap would silently drop everybody between them. */
  const sorted=tiers.slice().sort((a,b)=>a.fromRank-b.fromRank);
  for(let i=0;i<sorted.length;i++){
    if(sorted[i].toRank<sorted[i].fromRank) return toast('«تا رتبه» نمی‌تواند از «از رتبه» کمتر باشد','bad');
    if(i&&sorted[i].fromRank<=sorted[i-1].toRank) return toast('بازهٔ رتبه‌ها روی هم افتاده: '+sorted[i-1].label+' و '+sorted[i].label,'bad');
    if(i&&sorted[i].fromRank>sorted[i-1].toRank+1) return toast('بین '+sorted[i-1].label+' و '+sorted[i].label+' رتبه‌های بی‌لیگ جا مانده','bad');
  }
  try{
    await api('PUT','/admin/leagues/config',{
      enabled:$('#lg_on').checked, roomSize:Number($('#lg_size').value||15),
      roundGapMinutes:Number($('#lg_gap').value||20),
      kickoff:{dayOfWeek:Number($('#lg_dow').value||6),hour:Number($('#lg_h').value||21),minute:Number($('#lg_m').value||0),tzOffsetMinutes:210},
      tiers});
    toast('ذخیره شد','ok'); render();
  }catch(e){ toast(e.message,'bad'); }
}

/* The weights are meaningless on their own — 8 out of what? Show the real
 * chance so nobody sets a 50,000-toman prize to «8» thinking it is 8٪ when the
 * other weights add up to 20. */
function qmkChance(){
  const el=$('#qmk_chance'); if(!el)return;
  const ps=qmkReadPrizes(), tot=ps.reduce((s,p)=>s+Math.max(0,p.weight),0);
  el.innerHTML=tot<=0?'⚠️ همهٔ وزن‌ها صفر است — هیچ جایزه‌ای داده نمی‌شود.':
    'شانس هر جایزه: '+ps.filter(p=>p.weight>0).map(p=>esc(p.label||p.type)+' '+fa(Math.round(p.weight/tot*1000)/10)+'٪').join(' · ');
}

async function qBulk(action){
  const ids=[..._QSEL]; if(!ids.length)return;
  const label={approve:'تأیید',archive:'بایگانی',delete:'حذف'}[action];
  if(!confirm(label+' '+ids.length+' سوالِ انتخاب‌شده؟'+(action==='delete'?' (برگشت‌ناپذیر)':'')))return;
  let ok=0,bad=0;
  for(const id of ids){try{
    if(action==='delete')await api('DELETE','/admin/questions/'+id);
    else await api('PATCH','/admin/questions/'+id+'/status',{status:action==='approve'?'approved':'archived'});
    ok++;
  }catch(e){bad++;}}
  _QSEL.clear();
  toast(label+' شد: '+fa(ok)+(bad?' · ناموفق '+fa(bad):''),bad?'bad':'ok');
  render();
}

/* Shrink to a 256px square before upload. Topic art renders at ~64px, so a full
   camera/PNG file is wasted bytes on every player's first load — and the server
   rejects anything over its cap anyway. SVG is passed through untouched: it is
   already tiny and rasterising it would defeat the point. */
function catShrink(file){
  return new Promise((res,rej)=>{
    if(file.type==='image/svg+xml'){
      const fr=new FileReader(); fr.onload=()=>res(String(fr.result)); fr.onerror=()=>rej(new Error('خواندن فایل ناموفق بود')); fr.readAsDataURL(file); return;
    }
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('خواندن فایل ناموفق بود'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('این فایل تصویر معتبری نیست'));
      im.onload=()=>{
        const S=256, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
        const ctx=cv.getContext('2d');
        /* Cover-crop to a square so wide and tall pictures both fill the tile. */
        const s=Math.min(im.width,im.height);
        ctx.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);
        let out=''; try{ out=cv.toDataURL('image/webp',.9); }catch(e){}
        if(!out||out.indexOf('data:image/webp')!==0) out=cv.toDataURL('image/png');
        res(out);
      };
      im.src=String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}
function catPickImage(name){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/png,image/jpeg,image/webp,image/avif,image/svg+xml';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    try{
      const dataUri=await catShrink(f);
      const approxBytes=Math.round((dataUri.length-(dataUri.indexOf(',')+1))*3/4);
      if(approxBytes>_CAT_IMG_MAX) throw new Error('حجم تصویر بعد از فشرده‌سازی هنوز زیاد است ('+fa(Math.round(approxBytes/1024))+' کیلوبایت)');
      const r=await api('POST','/admin/categories/'+encodeURIComponent(name)+'/image',{image:dataUri});
      _CAT_IMG[name]=r.url;
      toast('عکس موضوع «'+name+'» ذخیره شد ✅','ok');
      renderCategories();
    }catch(e){ toast(e.message,'bad'); }
  };
  inp.click();
}
async function catRemoveImage(name){
  if(!confirm('عکس موضوع «'+name+'» حذف شود؟ (آیکون ایموجی جایگزین می‌شود)'))return;
  try{ await api('DELETE','/admin/categories/'+encodeURIComponent(name)+'/image'); delete _CAT_IMG[name]; toast('عکس حذف شد','ok'); renderCategories(); }
  catch(e){ toast(e.message,'bad'); }
}
async function catSave(){
  const before=_CATS.map(c=>c.name);
  catSyncFromDom();
  const clean=_CATS.filter(c=>c.name).map(c=>({name:c.name,icon:c.icon||'❓',enabled:c.enabled!==false,order:Number(c.order)||99}));
  try{
    await api('PATCH','/admin/config',{categories:clean});
    /* Artwork is keyed by NAME, so a rename would orphan the picture. Carry it
       across before reloading, or the admin would have to upload it again. */
    for(let i=0;i<_CATS.length;i++){
      const from=before[i], to=_CATS[i]&&_CATS[i].name;
      if(from&&to&&from!==to&&_CAT_IMG[from]){
        try{ await api('POST','/admin/categories/image/rename',{from:from,to:to}); }catch(e){}
      }
    }
    toast('موضوعات ذخیره شد ✅','ok');await loadCfg();render();
  }catch(e){toast(e.message,'bad');}
}

async function releaseAllHolds(){
  const holds=await api('GET','/admin/rewards/holds?status=pending&limit=500').catch(()=>[]);
  const list=Array.isArray(holds)?holds:(holds.rows||[]);
  if(!list.length)return toast('موردی برای واریز نیست');

}

/* A video is sent as-is: re-encoding it here is not something a browser can do
   well, and catShrink only understands pictures. */
async function bnUpload(which,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const target=which==='new'?$('#bnNewMedia'):$('#bnMedia_'+which);
  try{
    const uri=f.type.startsWith('video/')? await bnFileToDataUri(f) : await catShrink(f);
    target.value=uri;
    toast('فایل آماده شد — حالا ذخیره کن');
  }catch(e){ toast(e.message||'خطا در خواندن فایل'); }
}
function bnFileToDataUri(f){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('فایل خوانده نشد')); r.readAsDataURL(f); });
}

/* THE CODE THAT GUARDS A PAYOUT.
   It used to be the literal "1234" for every player and was never sent
   anywhere. This is where the operator turns it on or off and sees, plainly,
   whether SMS is really live — because when it is not, the test code works,
   and that must never be a surprise. */
/* LISTS OF NUMBERS THAT ARE NOT PLAYERS.
   Type a number, press Enter, it joins the group. Type the next, Enter. That
   is the whole interaction, so the input keeps focus and never loses what was
   typed — a form that clears itself between numbers is a form nobody can use
   for a hundred of them. */
/* What share of a list became players. An empty group divides by zero, so it
   answers 0 — fa() would print NaN as ۰ anyway, but the number itself goes to
   whatever uses it next. */
function sgPct(g){
  const n=Number(g&&g.count)||0, r=Number(g&&g.registered)||0;
  return n?Math.round((r/n)*100):0;
}

/* WHAT THE GAME IS ALLOWED TO SEND AT ALL.

   A category turned off here never reaches an inbox — not muted push, not
   written and hidden: never created. That is the difference that stops a bell
   filling up. */

  const box=$('#ntBody'); if(!box)return;

  catch(e){ box.innerHTML='<div class="card empty">'+(e.message||'خطا')+'</div>'; return; }

    '<b>چه اعلان‌هایی فرستاده شود</b>'+
    '<div class="sub" style="margin:6px 0 12px">هر دسته‌ای که خاموش کنی، دیگر <b>ساخته هم نمی‌شود</b> — نه در زنگولهٔ بازیکن می‌نشیند و نه روی گوشی می‌رود. کاربران جدا هم تنظیم خودشان را دارند؛ این کلیدِ کل بازی است.</div>'+
    (d.types||[]).map(function(t){
      const on=pol[t]!==false;
      return '<label style="display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)">'+
        '<input type="checkbox" '+(on?'checked':'')+' onchange="window._NT_POLICY[\''+t+'\']=this.checked">'+
        '<div style="flex:1"><b>'+esc(labels[t]||t)+'</b><div class="sub mono" style="font-size:11px">'+esc(t)+'</div></div>'+

  '</div>';
}

   device instead of broadcasting to everybody and hoping. */

  const b=$('#ntBody');
  try{
    const d=await api('GET','/admin/notifications/diagnostics');
    let pc={}; try{ pc=await api('GET','/admin/notifications/push-config'); }catch(e){}
    const live=!!d.vapidConfigured;
    const whence=d.source==='env'?'روی خودِ سرور (متغیر محیطی)':d.source==='db'?'در همین پنل':'—';
    b.innerHTML=

/* The keys themselves. Two strings, but they are the entire difference between
   "message written to the inbox" and "phone lights up", so they get a real form
   rather than a server-side file only an admin with SSH can reach. */
function ntPushKeysCard(pc){
  pc=pc||{};
  const envLocked=!!pc.envOverride;
  return '<div class="card" style="margin-top:14px"><h3>🔑 کلیدهای اعلان (VAPID)</h3>'+
    (envLocked
      ? '<div class="note" style="border-color:#F1B211">این کلیدها روی خودِ سرور (متغیر محیطی) تنظیم شده‌اند و بر تنظیمات این صفحه اولویت دارند. تغییر اینجا ذخیره می‌شود ولی تا وقتی متغیر محیطی هست، اثری ندارد.</div>'
      : '<div class="sub" style="margin-bottom:10px">اگر کلیدی ندارید، «ساخت کلید تازه» را بزنید و بعد ذخیره کنید. نیازی به ری‌استارت سرور نیست.</div>')+
    '<div class="field"><label>وضعیت</label>'+
      '<select id="pk_provider"><option value="webpush"'+(pc.provider==='webpush'?' selected':'')+'>روشن — اعلان به گوشی برود</option>'+
      '<option value="log"'+(pc.provider!=='webpush'?' selected':'')+'>خاموش — فقط در صندوق داخل برنامه</option></select></div>'+
    '<div class="field"><label>کلید عمومی (Public Key)</label><input id="pk_pub" dir="ltr" value="'+esc(pc.publicKey||'')+'" placeholder="B..."></div>'+
    '<div class="field"><label>کلید خصوصی (Private Key)</label><input id="pk_priv" dir="ltr" placeholder="'+(pc.privateKeySet?esc(pc.privateKeyHint)+' — برای نگه‌داشتن، خالی بگذارید':'هنوز تنظیم نشده')+'"></div>'+
    '<div class="field"><label>آدرس تماس (به push service اعلام می‌شود)</label><input id="pk_subj" dir="ltr" value="'+esc(pc.subject||'mailto:info@prizequiz.ir')+'"></div>'+
    '<button class="btn pri" onclick="ntSavePushKeys()">ذخیره</button> '+
    '<button class="btn" onclick="ntGenPushKeys()">🎲 ساخت کلید تازه</button>'+
    '<div id="pk_res"></div></div>';
}
async function ntGenPushKeys(){
  /* Regenerating silently would log every already-registered phone out of
     notifications with no way to tell why, so it is asked about first. */
  if($('#pk_pub').value.trim() && !confirm('کلید فعلی جایگزین می‌شود. هر گوشی که تا حالا اجازهٔ اعلان داده، بی‌اعتبار می‌شود و کاربر باید دوباره اجازه بدهد. ادامه؟')) return;
  try{
    const k=await api('POST','/admin/notifications/push-keys/generate');
    $('#pk_pub').value=k.publicKey; $('#pk_priv').value=k.privateKey;
    $('#pk_res').innerHTML='<div class="note">کلید ساخته شد ولی <b>هنوز ذخیره نشده</b> — دکمهٔ «ذخیره» را بزنید.</div>';
  }catch(e){ $('#pk_res').innerHTML='<div class="note" style="border-color:#E8544F">❌ '+esc(e.message)+'</div>'; }
}
async function ntSavePushKeys(){
  const box=$('#pk_res');
  try{
    await api('POST','/admin/notifications/push-config',{
      provider:$('#pk_provider').value, publicKey:$('#pk_pub').value.trim(),
      privateKey:$('#pk_priv').value.trim(), subject:$('#pk_subj').value.trim()});
    box.innerHTML='<div class="note" style="border-color:#2FBF71">✅ ذخیره شد.</div>';
    ntRenderPush();
  }catch(e){ box.innerHTML='<div class="note" style="border-color:#E8544F">❌ '+esc(e.message)+'</div>'; }
}
async function ntTestPush(){
  const user=$('#nt_tuser').value.trim(), box=$('#nt_tres');
  if(!user) return toast('کاربر را وارد کن','bad');
  box.innerHTML='<div class="note">در حال ارسال…</div>';
  try{
    const r=await api('POST','/admin/notifications/test',{user,body:$('#nt_tbody').value});
    const good=r.status==='sent';
    box.innerHTML='<div class="note" style="border-color:'+(good?'#2FBF71':'#F1B211')+'">'+(good?'✅ ':'⚠️ ')+esc(r.hint)+
      '<br><span class="mono" style="font-size:11px">devices='+fa(r.devices)+' · status='+esc(r.status)+(r.error?(' · '+esc(r.error)):'')+'</span></div>';
  }catch(e){ box.innerHTML='<div class="note" style="border-color:#E8544F">❌ '+esc(e.message)+'</div>'; }
}

function ntSegChange(){const b=$('#seg_base').value;$('#seg_manual_wrap').style.display=b==='manual'?'block':'none';$('#seg_filters').style.display=b==='manual'?'none':'block';}
function ntWhenChange(){const s=document.querySelector('input[name=nt_when]:checked').value;$('#nt_at').style.display=s==='sched'?'inline-block':'none';const g=$('#nt_go');if(g)g.textContent=s==='sched'?'🕒 زمان‌بندی':'📣 ارسال فوری';}
function ntCollectSegment(){
  const base=$('#seg_base').value;
  if(base==='manual'){const ids=($('#seg_uids').value||'').split(',').map(s=>s.trim()).filter(Boolean);return {userIds:ids};}
  const s={};if(base!=='all')s.base=base;
  const plan=$('#seg_plan').value;if(plan)s.plan=plan;
  const st=$('#seg_status').value;if(st)s.status=st;
  const nv2=id=>{const v=$('#'+id).value;return v===''?undefined:Number(v);};
  const minlvl=nv2('seg_minlvl');if(minlvl!=null)s.minLevel=minlvl;
  const maxlvl=nv2('seg_maxlvl');if(maxlvl!=null)s.maxLevel=maxlvl;
  const minxp=nv2('seg_minxp');if(minxp!=null)s.minXp=minxp;
  const wlt=nv2('seg_walletlt');if(wlt!=null)s.walletLt=wlt;
  const wgt=nv2('seg_walletgt');if(wgt!=null)s.walletGt=wgt;
  const tk=$('#seg_tickets').value;if(tk==='yes')s.hasTickets=true;else if(tk==='no')s.hasTickets=false;
  return s;
}

  try{const seg=ntCollectSegment();const r=await api('POST','/admin/notifications/segment/preview',seg);$('#seg_count').innerHTML='👥 <b style="color:var(--ok,#3c9)">'+fa(r.count||0)+'</b> کاربر — <span style="color:var(--muted)">'+esc(r.description||'')+'</span>';}
  catch(e){toast(e.message,'bad');}
}
async function ntSubmit(testToSelf){
  const title=($('#nt_title')||{}).value?.trim(),body=($('#nt_body')||{}).value?.trim();
  if(!title||!body)return toast('عنوان و متن لازم است','bad');
  const type=$('#nt_type').value,link=$('#nt_link').value,image=($('#nt_image').value||'').trim();
  const action=link?{url:link}:undefined;
  const when=document.querySelector('input[name=nt_when]:checked').value;
  const payload={title,body,type,image:image||undefined,action};
  try{
    if(testToSelf){
      const tid=prompt('آی‌دی کاربرِ آزمایشی (فقط به همین یک نفر ارسال می‌شود):');
      if(!tid||!tid.trim())return;
      const r=await api('POST','/admin/notifications/broadcast',{...payload,segment:{userIds:[tid.trim()]}});
      toast('پیام آزمایشی ارسال شد 🧪 — '+fa(r.audienceCount||0)+' مخاطب','ok');return;
    }
    if(when==='now'){
      const r=await api('POST','/admin/notifications/broadcast',{...payload,segment:seg});
      toast('ارسال شد ✅ — '+fa(r.audienceCount||0)+' مخاطب','ok');NT_TAB='history';render();
    }else{
      const at=$('#nt_at').value;if(!at)return toast('زمان ارسال را انتخاب کن','bad');
      await api('POST','/admin/notifications/schedule',{...payload,segment:seg,scheduledAt:new Date(at).toISOString()});
      toast('زمان‌بندی شد 🕒','ok');NT_TAB='scheduled';render();
    }
  }catch(e){toast(e.message,'bad');}
}

function qrEdit(qid){

/* ---- package rows ---- */
function shopRewardsRender(){
  const box=$('#sh_rewards'); if(!box)return;
  const rows=window._SH_REWARDS||[];
  if(!rows.length){ box.innerHTML='<div class="sub">ردیفی نیست — این آیتم فقط همان «اثر خرید» بالا را می‌دهد.</div>'; return; }
  box.innerHTML=rows.map(function(r,i){
    const opts=Object.keys(SHOP_EFFECTS).map(k=>'<option value="'+k+'"'+(r.key===k?' selected':'')+'>'+esc(SHOP_EFFECTS[k])+'</option>').join('');
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'+
      '<select onchange="shopRewardSet('+i+',\'key\',this.value)" style="flex:1">'+opts+'</select>'+
      '<input type="number" min="1" value="'+(Number(r.value)||1)+'" onchange="shopRewardSet('+i+',\'value\',this.value)" style="width:110px">'+
      '<button class="btn sm bad" onclick="shopRewardDel('+i+')">حذف</button></div>';
  }).join('');
}
function shopRewardAdd(){ (window._SH_REWARDS=window._SH_REWARDS||[]).push({key:Object.keys(SHOP_EFFECTS)[0],value:1}); shopRewardsRender(); }
function shopRewardDel(i){ window._SH_REWARDS.splice(i,1); shopRewardsRender(); }
function shopRewardSet(i,f,v){ window._SH_REWARDS[i][f]=(f==='value'?Math.max(1,Number(v)||1):v); if(f==='value')shopRewardsRender(); }
/* ---- artwork ---- */
function shopImgRender(){
  const b=$('#sh_img_prev'); if(!b)return;
  b.innerHTML=window._SH_IMG
    ? '<img src="'+esc(window._SH_IMG)+'" style="max-width:100%;max-height:70px;object-fit:contain">'
    : '<span class="sub">بدون عکس</span>';
}
function shopClearImage(){ window._SH_IMG=''; shopImgRender(); }
function shopPickImage(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/png,image/jpeg,image/webp,image/avif,image/svg+xml';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    /* Reuses the same shrink-to-WebP path the topic art uses — one code path,
       one behaviour, and no second place to keep in step. */
    try{ window._SH_IMG=await catShrink(f); shopImgRender(); toast('عکس آماده شد — برای ثبت، ذخیره را بزن','ok'); }
    catch(e){ toast(e.message||'عکس خوانده نشد','bad'); }
  };
  inp.click();
}
async function shopSaveItem(id){
  let cat=$('#sh_cat').value; if(cat==='__custom')cat=($('#sh_cat_custom').value||'').trim()||'util';
  const name=$('#sh_name').value.trim(); if(!name)return toast('نام آیتم لازم است','bad');
  const body={id:id||undefined,icon:$('#sh_icon').value.trim()||'🛍️',name,description:$('#sh_desc').value.trim(),category:cat,
    price:Number($('#sh_price').value||0),currency:$('#sh_cur').value,effectKey:$('#sh_eff').value,effectValue:Number($('#sh_effval').value||1),
    sortOrder:Number($('#sh_order').value||0),badge:$('#sh_badge').value.trim(),enabled:$('#sh_enabled').value==='1',
    /* Always sent, both of them: leaving a field out means "keep what was
       there", so an emptied package or a removed picture would survive a save
       that was meant to clear it. */
    rewards:(window._SH_REWARDS||[]).filter(r=>r&&r.key&&Number(r.value)>0),
    image:window._SH_IMG||''};
  /* The mismatch that caused «یک کمک خریداری شد» on a ticket: an item sitting
     in the tickets category whose effect hands over something else. It is a
     legitimate thing to want (a bundle can live there), so this asks rather
     than refuses — but it never happens silently again. */
  const rows=body.rewards||[];
  const gives=rows.length?rows.map(r=>r.key):[body.effectKey];
  if(cat==='tickets'&&!gives.some(k=>SHOP_TICKET_EFFECTS.indexOf(k)>=0)){
    const what=gives.map(k=>SHOP_EFFECTS[k]||k).join('، ');
    if(!confirm('این آیتم در دستهٔ «بلیط مسابقات» است ولی بلیطی نمی‌دهد — چیزی که می‌دهد: '+what+'\n\nبازیکن بعد از خرید همان را می‌بیند. ذخیره شود؟')) return;
  }
  try{await api('POST','/admin/shop/items',body);toast('ذخیره شد ✅','ok');document.querySelector('.modal-bg').remove();render();}catch(e){toast(e.message,'bad');}
}

/* Shrinks the picked file before it is ever sent: a 4 MB phone photo becomes a
   few tens of KB, which is what keeps the roster fast to load on a phone. */
function chPickImage(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const maxKB=window._CH_MAXKB||600;
  const img=new Image();
  const url=URL.createObjectURL(f);
  img.onload=function(){
    URL.revokeObjectURL(url);
    const MAX=512;
    let w=img.width,h=img.height;
    if(w>MAX||h>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    // Try the smallest modern format first and keep whichever the browser
    // actually produced — canvas silently falls back to PNG when it cannot
    // encode the type you asked for.
    const tries=['image/webp','image/png'];
    let best='';
    for(const t of tries){
      const d=cv.toDataURL(t,0.9);
      if(d.indexOf('data:'+t)===0 && (!best||d.length<best.length))best=d;
    }
    if(!best)best=cv.toDataURL('image/png');
    const kb=Math.round((best.length-best.indexOf(',')-1)*3/4/1024);
    if(kb>maxKB){ toast('تصویر حتی بعد از فشرده‌سازی '+fa(kb)+'KB است؛ تصویر کوچک‌تری انتخاب کن','bad'); return; }
    window._CH_IMG=best;
    $('#ch_prevbox').innerHTML=chThumb(best,96);
    $('#ch_size').textContent='فشرده شد: '+fa(kb)+' کیلوبایت • '+fa(w)+'×'+fa(h);
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast('این فایل تصویر نیست','bad'); };
  img.src=url;
}

async function chSave(id){
  const name=($('#ch_name').value||'').trim();
  if(!name)return toast('نام کاراکتر لازم است','bad');
  const urlV=($('#ch_img').value||'').trim();
  const body={
    id:id||undefined, name,
    description:($('#ch_desc').value||'').trim(),
    kind:$('#ch_kind').value,
    unlockLevel:Number($('#ch_lvl').value||0),
    price:Number($('#ch_price').value||0),
    sortOrder:Number($('#ch_order').value||0),
    enabled:$('#ch_enabled').value==='1',
    viaLevel:$('#ch_viaLevel').checked, viaReward:$('#ch_viaReward').checked,
    viaEvent:$('#ch_viaEvent').checked, viaRandom:$('#ch_viaRandom').checked,
    viaPurchase:$('#ch_viaPurchase').checked,
    newUntil:($('#ch_new').value||'')?new Date($('#ch_new').value+'T23:59:59').toISOString():''
  };
  const img=urlV||window._CH_IMG||'';
  if(img)body.image=img;
  try{ await api('POST','/admin/characters',body); toast('ذخیره شد ✅','ok'); document.querySelector('.modal-bg').remove(); render(); }
  catch(e){ toast(e.message,'bad'); }
}
async function chToggle(id){
  const c=(window._CH_ROWS||{})[id]; if(!c)return;
  try{ await api('PATCH','/admin/characters/'+id,{enabled:!c.enabled}); toast(c.enabled?'غیرفعال شد':'فعال شد','ok'); render(); }
  catch(e){ toast(e.message,'bad'); }
}
async function chDelete(id){
  const c=(window._CH_ROWS||{})[id]||{};

  try{ await api('DELETE','/admin/characters/'+id); toast('حذف شد','ok'); render(); }

async function chGrantRun(id){
  const m=$('#chg_mode').value; const body={source:$('#chg_src').value};
  if(m==='all'){ if(!confirm('به همهٔ کاربران اهدا شود؟'))return; body.all=true; }
  else if(m==='many'){ body.userIds=($('#chg_many').value||'').split('\n').map(s=>s.trim()).filter(Boolean); if(!body.userIds.length)return toast('حداقل یک شناسه بنویس','bad'); }
  else { body.userId=($('#chg_one').value||'').trim(); if(!body.userId)return toast('شناسهٔ کاربر لازم است','bad'); }
  try{
    const r=await api('POST','/admin/characters/'+id+'/grant',body);
    toast('اهدا شد: '+fa(r.granted)+' نفر'+(r.already?' • '+fa(r.already)+' نفر از قبل داشتند':''),'ok');
    document.querySelector('.modal-bg').remove(); render();
  }catch(e){ toast(e.message,'bad'); }
}

async function cbDrawRun(id){
  const m=$('#cbd_mode').value; const body={};

/* WHICH TOPICS «تصادفی» IS ALLOWED TO USE.
   «تصادفی» draws from the whole approved bank, which is right by default and
   wrong the moment an operator has a category they do not want turning up in
   the random mix. Ticking nothing keeps the old behaviour — every category —
   so this screen changes nothing until it is used. */
function lsRandomPoolCard(topics){
  const cats=(topics&&topics.categories)||[];
  const picked=(topics&&topics.randomCategories)||[];
  const name=(topics&&topics.randomTopic)||'تصادفی';
  if(!cats.length){
    return '<div class="card"><h3>🎲 موضوع‌های «'+esc(name)+'»</h3>'+
      '<div class="empty">هنوز هیچ موضوعی سؤال تأییدشده ندارد.</div></div>';
  }
  const total=cats.reduce((n,c)=>n+(Number(c.questionCount)||0),0);
  const inPool=picked.length
    ? cats.filter(c=>picked.indexOf(c.name)>=0).reduce((n,c)=>n+(Number(c.questionCount)||0),0)
    : total;
  return '<div class="card"><h3>🎲 موضوع‌های «'+esc(name)+'»</h3>'+
    '<div class="note">سؤال‌های «'+esc(name)+'» از این موضوع‌ها بیرون می‌آید. اگر <b>هیچ‌کدام</b> تیک نخورده باشد، از <b>همهٔ</b> موضوع‌ها استفاده می‌شود — یعنی همان رفتار قبلی. '+
    'موضوعی که اینجا تیک نخورده باشد همچنان می‌تواند به‌صورت مستقل در فهرست بالا فعال باشد؛ فقط داخل «'+esc(name)+'» نمی‌آید.<br>'+
    'الان استخر «'+esc(name)+'»: <b>'+fa(inPool)+'</b> سؤال از مجموع '+fa(total)+'.</div>'+
    '<div id="lsRndBox" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">'+
      cats.map((c,i)=>'<label style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line,#333);border-radius:10px;padding:6px 10px;cursor:pointer">'+
        '<input type="checkbox" class="ls_rnd" data-name="'+esc(c.name)+'"'+(picked.indexOf(c.name)>=0?' checked':'')+'>'+
        '<span>'+esc(c.name)+' <span class="mono" style="opacity:.6">'+fa(c.questionCount)+'</span></span></label>').join('')+
    '</div>'+
    '<button class="btn pri" onclick="lsSaveRandomPool()">💾 ذخیرهٔ استخر تصادفی</button> '+
    '<button class="btn" onclick="lsRndAll(true)">تیک همه</button> '+
    '<button class="btn" onclick="lsRndAll(false)">برداشتن همه (=همهٔ موضوع‌ها)</button></div>';
}
function lsRndAll(on){ document.querySelectorAll('.ls_rnd').forEach(b=>{b.checked=!!on;}); }
async function lsSaveRandomPool(){
  const picked=[...document.querySelectorAll('.ls_rnd:checked')].map(b=>b.dataset.name);
  /* Ticking every one of them means the same thing as ticking none, and an
     empty list is the honest way to store "no restriction" — otherwise a
     category added later would silently be left out of the pool. */
  const all=document.querySelectorAll('.ls_rnd').length;
  const send=(picked.length===all)?[]:picked;
  try{
    const r=await api('PUT','/admin/last-survivor/random-categories',{categories:send});
    toast(send.length?('استخر تصادفی: '+fa(r.questionCount)+' سؤال از '+fa(send.length)+' موضوع'):'تصادفی از همهٔ موضوع‌ها استفاده می‌کند','ok');
    render();
  }catch(e){ toast(e.message||'خطا','bad'); }
}

async function lsRestoreTopic(name){

/* Two different things wear the same button. A topic invented here is deleted
   outright; one that exists because its category holds questions is taken off
   the list — deleting its settings would only bring it back on the next read,
   so promising a delete would be a lie. The confirm says which one this is. */
async function lsDeleteTopic(name,custom){
  const msg=custom
    ? 'موضوع «'+name+'» کامل حذف شود؟'
    : 'موضوع «'+name+'» از فهرست بازی برداشته شود؟\n\nسؤال‌هایش پاک نمی‌شود؛ فقط دیگر به بازیکن‌ها نشان داده نمی‌شود و هر وقت خواستی برمی‌گردانی.';
  if(!confirm(msg)) return;
  try{const r=await api('DELETE','/admin/last-survivor/topics/'+encodeURIComponent(name));
    toast(r&&r.action==='removed'?'حذف شد':'از فهرست برداشته شد','ok');render();}catch(e){toast(e.message,'bad');}
}

async function lsStartRoom(id){
  if(!confirm('این مسابقه همین حالا شروع شود؟')) return;
  try{const r=await api('POST','/admin/last-survivor/rooms/'+id+'/start');
    toast(r.status==='running'?('شروع شد با '+fa(r.players)+' بازیکن'):'هنوز شروع نشد — احتمالاً بازیکن کافی نیست', r.status==='running'?'ok':'bad');
    render();}catch(e){toast(e.message,'bad');}
}
async function lsCancelRoom(id){
  if(!confirm('این مسابقه لغو شود؟ بلیط همهٔ بازیکن‌ها برمی‌گردد.')) return;
  try{const r=await api('POST','/admin/last-survivor/rooms/'+id+'/cancel');
    toast('لغو شد — '+fa(r.refunded)+' بلیط برگشت','ok');render();}catch(e){toast(e.message,'bad');}
}
async function lsRoomDetail(id){
  const box=$('#lsRoomBox'); if(!box) return;
  box.innerHTML='<div class="card empty">در حال بارگذاری…</div>';
  let d; try{ d=await api('GET','/admin/last-survivor/rooms/'+id); }
  catch(e){ box.innerHTML='<div class="card empty">'+esc(e.message||'خطا')+'</div>'; return; }
  const FA_ST={waiting:'در انتظار',alive:'زنده',eliminated:'حذف‌شده',cashed_out:'برداشت کرد'};
  const COL={green:'🟢',blue:'🔵',red:'🔴'};
  const when=(ms)=>ms?new Date(Number(ms)).toLocaleString('fa-IR'):'—';
  const rows=(d.players||[]).map(p=>[
    esc(p.username||'—')+' <span class="mono" style="opacity:.5">'+String(p.userId).slice(0,8)+'</span>',
    (COL[p.color]||'')+' '+esc(p.color),
    fa(p.units),
    '<span class="pill '+(p.status==='cashed_out'?'ok':(p.status==='eliminated'?'bad':'gold'))+'">'+(FA_ST[p.status]||esc(p.status))+'</span>',
    p.eliminatedRound?('دور '+fa(p.eliminatedRound)):(p.cashedOutRound?('دور '+fa(p.cashedOutRound)):'—'),
    p.payoutCash?('<b style="color:var(--gold)">'+fa(p.payoutCash)+' ت</b>'):'—',
    when(p.joinedAt)
  ]);
  const t=d.totals||{};
  box.innerHTML='<div class="card"><h3>🔎 مسابقهٔ <span class="mono">'+String(d.room.id).slice(0,8)+'</span> — '+esc(d.room.topic)+'</h3>'+
    '<div class="grid g4">'+
      '<div class="field"><label>وضعیت</label><b>'+esc(d.room.status)+' · '+esc(d.room.phase)+'</b></div>'+
      '<div class="field"><label>مرحله</label><b>'+fa(d.room.round)+'/'+fa(d.room.totalRounds)+'</b></div>'+
      '<div class="field"><label>استخر ناخالص</label><b style="color:var(--gold)">'+fa(d.room.grossPool)+' ت</b></div>'+
      '<div class="field"><label>سهم خانه</label><b>'+fa(d.room.rakePercent)+'٪</b></div>'+
      '<div class="field"><label>بازیکنان</label><b>'+fa(t.players||0)+'</b></div>'+
      '<div class="field"><label>زنده</label><b>'+fa(t.alive||0)+'</b></div>'+
      '<div class="field"><label>برداشت‌کرده</label><b>'+fa(t.cashedOut||0)+'</b></div>'+
      '<div class="field"><label>مجموع پرداختی</label><b style="color:var(--gold)">'+fa(t.paidOut||0)+' ت</b></div>'+
      '<div class="field"><label>ساخته‌شده</label><b>'+when(d.room.createdAt)+'</b></div>'+
      '<div class="field"><label>شروع</label><b>'+when(d.room.startedAt)+'</b></div>'+
      '<div class="field"><label>پایان</label><b>'+when(d.room.endedAt)+'</b></div>'+
    '</div>'+
    (rows.length?tbl(['بازیکن','بلیط','ضریب','وضعیت','خروج','دریافتی','ورود'],rows)
               :'<div class="empty">هیچ بازیکنی در این روم نیست.</div>')+
    '<div class="row" style="margin-top:10px"><button class="btn sm" onclick="$(\'#lsRoomBox\').innerHTML=\'\'">بستن</button></div></div>';
  box.scrollIntoView({behavior:'smooth',block:'start'});
}



/* ================= ONBOARDING SLIDES ================= */
/* The welcome sequence a new player sees. Kept as data so a campaign or a
   seasonal set is a panel edit, not a release: switch a slide off, reorder it,
   or give it a date window and it retires by itself. */
let OB_ROWS=[], OB_EDIT=null;
async function renderOnboarding(){
  $('#main').innerHTML=head('خوش‌آمدگویی','اسلایدهایی که کاربر در اولین ورود می‌بیند',
    ' <button class="btn pri" onclick="obEdit()">➕ اسلاید جدید</button>')+
    '<div id="obBody"><div class="skel"></div></div>';
  const b=$('#obBody');
  try{
    const d=await api('GET','/admin/onboarding');
    OB_ROWS=d.rows||[];
    b.innerHTML=
      '<div class="note">تصویر هر اسلاید را از همین‌جا آپلود کنید (PNG با پس‌زمینهٔ شفاف، حداکثر ۶۰۰ کیلوبایت). تا وقتی تصویری نگذارید، همان ایموجی بزرگ نمایش داده می‌شود و صفحه خراب به نظر نمی‌رسد.</div>'+
      '<div class="note">برای یک کمپین مناسبتی: اسلاید تازه بسازید، «شروع» و «پایان» را پر کنید و اسلایدهای همیشگی را دست‌نخورده بگذارید.</div>'+
      tbl(['تصویر','عنوان','متن','فعال','بازه','ترتیب','عملیات'],
        OB_ROWS.map(r=>[
          (r.image?'<img src="'+esc(r.image)+'" style="width:52px;height:52px;object-fit:contain;background:'+esc(r.color)+'22;border-radius:10px">'
                  :'<div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:26px;background:'+esc(r.color)+'22;border-radius:10px">'+esc(r.emoji)+'</div>'),
          '<b>'+esc(r.title)+'</b>',
          '<div style="max-width:320px;font-size:12px;color:#9fb0a6">'+esc((r.body||'').slice(0,110))+'</div>',
          r.enabled?'<span class="badge ok">فعال</span>':'<span class="badge">خاموش</span>',
          (r.startsAt||r.endsAt)?('<span class="mono" style="font-size:11px">'+esc((r.startsAt||'—')+' → '+(r.endsAt||'—'))+'</span>'):'همیشه',
          String(r.sortOrder),
          '<button class="btn sm" onclick="obEdit(\''+r.id+'\')">ویرایش</button> <button class="btn sm bad" onclick="obDel(\''+r.id+'\')">حذف</button>'
        ]));
  }catch(e){ b.innerHTML='<div class="card empty">'+(e.message||'خطا')+'</div>'; }
}
function obEdit(id){
  const r=OB_ROWS.find(x=>x.id===id)||{id:'',title:'',body:'',image:'',emoji:'✨',color:'#8B5CF6',enabled:true,startsAt:'',endsAt:'',sortOrder:(OB_ROWS.length+1)};
  OB_EDIT={...r};
  modal(id?'ویرایش اسلاید':'اسلاید جدید',
    '<div class="field"><label>عنوان</label><input id="ob_title" value="'+esc(r.title)+'" placeholder="به پرایز کوییز خوش اومدی!"></div>'+
    '<div class="field"><label>متن</label><textarea id="ob_body" rows="3" placeholder="در یکی دو جمله بگو این صفحه چه چیزی را توضیح می‌دهد">'+esc(r.body)+'</textarea></div>'+
    '<div class="grid g3">'+
      '<div class="field"><label>ایموجی (جایگزین تصویر)</label><input id="ob_emoji" value="'+esc(r.emoji)+'" style="text-align:center"></div>'+
      '<div class="field"><label>رنگ</label><input id="ob_color" type="color" value="'+esc(r.color||'#8B5CF6')+'"></div>'+
      '<div class="field"><label>ترتیب</label><input id="ob_sort" type="number" value="'+(r.sortOrder|0)+'"></div>'+
    '</div>'+
    '<div class="grid g3">'+
      '<div class="field"><label>وضعیت</label><select id="ob_en"><option value="1"'+(r.enabled?' selected':'')+'>فعال</option><option value="0"'+(!r.enabled?' selected':'')+'>خاموش</option></select></div>'+
      '<div class="field"><label>شروع نمایش (اختیاری)</label><input id="ob_from" type="datetime-local" value="'+esc(obLocal(r.startsAt))+'"></div>'+
      '<div class="field"><label>پایان نمایش (اختیاری)</label><input id="ob_to" type="datetime-local" value="'+esc(obLocal(r.endsAt))+'"></div>'+
    '</div>'+
    '<div class="field"><label>تصویر کاراکتر</label><input id="ob_file" type="file" accept="image/*" onchange="obPick(this)">'+
      '<div id="ob_prev" style="margin-top:8px">'+(r.image?'<img src="'+esc(r.image)+'" style="max-height:120px">':'<span style="color:#9fb0a6;font-size:12px">تصویری انتخاب نشده — ایموجی نمایش داده می‌شود</span>')+'</div></div>'+
    '<button class="btn pri" onclick="obSave()">💾 ذخیره</button>');
}
function obLocal(iso){ if(!iso)return ''; try{ const d=new Date(iso); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }catch(e){ return ''; } }
/* Shrunk in the browser before upload: a phone photo would blow past the size
   limit and the panel would just say "too large" with no way forward. */
function obPick(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const img=new Image(); const rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
    const max=520, sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    let out=cv.toDataURL('image/webp',0.9);
    if(out.indexOf('data:image/webp')!==0) out=cv.toDataURL('image/png');
    OB_EDIT.image=out;
    $('#ob_prev').innerHTML='<img src="'+out+'" style="max-height:120px"><div style="font-size:11px;color:#9fb0a6;margin-top:4px">'+Math.round(out.length*3/4/1024)+' کیلوبایت</div>';
  }; img.src=rd.result; };
  rd.readAsDataURL(f);
}
async function obSave(){
  const iso=v=>{ const x=$(v).value; return x?new Date(x).toISOString():''; };
  const payload={
    id:OB_EDIT.id||undefined,
    title:$('#ob_title').value.trim(),
    body:$('#ob_body').value.trim(),
    emoji:$('#ob_emoji').value.trim()||'✨',
    color:$('#ob_color').value,
    enabled:$('#ob_en').value==='1',
    startsAt:iso('#ob_from'), endsAt:iso('#ob_to'),
    sortOrder:Number($('#ob_sort').value||0),
    image:OB_EDIT.image||''
  };
  if(!payload.title) return toast('عنوان لازم است','bad');
  try{ await api('POST','/admin/onboarding',payload);
    document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
    toast('ذخیره شد ✅','ok'); renderOnboarding(); }
  catch(e){ toast(e.message,'bad'); }
}
async function obDel(id){
  if(!confirm('این اسلاید حذف شود؟')) return;
  try{ await api('DELETE','/admin/onboarding/'+encodeURIComponent(id)); toast('حذف شد','ok'); renderOnboarding(); }
  catch(e){ toast(e.message,'bad'); }
}

/* ================= LIFELINES ================= */
/* The catalogue is the single source of truth for the game: keys, labels,
   prices, what a new player starts with, and — for a time help — how many
   seconds it adds. Editing a row here changes the buttons in the match and the
   cards in the shop with no release. */
let LL_ROWS=[];
/* ── WHEEL + DAILY REWARD ──────────────────────────────────────────────────
   Everything the player can win, in one place: how many segments the wheel
   has, what each pays, how likely it is, and how long the streak calendar
   runs. Weights are relative numbers and mean nothing on their own, so the
   real odds and the expected cost per spin are computed and shown alongside —
   an operator setting a jackpot should see what it costs before players do. */
let RW_CFG=null;
const RW_TYPES=[['coins','🪙 سکه'],['xp','⚡ XP'],['cash','💰 تومان (صندوق جایزه)'],['ticket','🎫 بلیت'],['heart','❤️ قلب'],['lifeline','🧩 کمک'],['nothing','— پوچ']];
function rwTypeSel(idp,i,v){
  return '<select id="'+idp+'_type_'+i+'" onchange="rwHint(\''+idp+'\','+i+')">'+
    RW_TYPES.map((t)=>'<option value="'+t[0]+'"'+(v===t[0]?' selected':'')+'>'+t[1]+'</option>').join('')+'</select>';
}
function rwHint(idp,i){
  const t=($('#'+idp+'_type_'+i)||{}).value, el=$('#'+idp+'_target_'+i);
  if(!el) return;
  el.placeholder = t==='ticket' ? 'green / blue / red' : t==='lifeline' ? 'p5050 / ptime / psecond' : '—';
  el.disabled = !(t==='ticket'||t==='lifeline');
}
let RW_ODDS={rows:[],perSpin:{}};
let RW_HOLD={enabled:false,riskThreshold:90};
/* ── RECORD MODE ──────────────────────────────────────────────────────────
   The settings that decide how much of the rest of the game this mode is
   allowed to touch. All the scoring knobs default to zero on purpose: record
   mode is meant to be its own thing, and turning any of them up makes it feed
   XP, cup or coins into the parts of the game that carry real prizes. */
let RM_CFG=null;
/* ================= CHAT PACKS =================
   Everything the player can say mid-match: the group names, their emoji, their
   prices, whether a price is in coins or in cash, and every sentence in every
   group. The client holds none of it — what is typed here is what the game
   offers on the next request. */
let CP_PACKS=[], CP_MAX={phrases:40,length:80};
async function renderChatPacks(){
  $('#main').innerHTML=head('پک‌های چت','جمله‌های آمادهٔ داخل مسابقه — نام، قیمت و متن هر گروه')+
    '<div id="cpBody"><div class="skel"></div></div>';
  const b=$('#cpBody');
  try{
    const d=await api('GET','/admin/chat-packs');
    CP_PACKS=(d.packs||[]).map(p=>({...p,phrases:[...(p.phrases||[])]}));
    CP_MAX={phrases:d.maxPhrases||40,length:d.maxLength||80};
    cpDraw();
  }catch(e){ b.innerHTML='<div class="card empty">'+esc(e.message||'خطا')+'</div>'; }
}
function cpDraw(){
  const b=$('#cpBody'); if(!b) return;
  const cards=CP_PACKS.map((p,i)=>
    '<div class="card">'+
      '<h3>'+esc(p.emoji||'💬')+' '+esc(p.name||p.key)+' <span class="sub" style="font-weight:400">('+esc(p.key)+')</span></h3>'+
      '<div class="grid g4">'+
        '<div class="field"><label>نام گروه</label><input id="cp_n'+i+'" value="'+esc(p.name||'')+'" maxlength="60"></div>'+
        '<div class="field"><label>ایموجی</label><input id="cp_e'+i+'" value="'+esc(p.emoji||'💬')+'" maxlength="8"></div>'+
        '<div class="field"><label>رایگان؟</label><select id="cp_f'+i+'" onchange="cpSync('+i+')">'+
          '<option value="1"'+(p.free?' selected':'')+'>رایگان برای همه</option>'+
          '<option value="0"'+(!p.free?' selected':'')+'>فروشی</option></select></div>'+
        '<div class="field"><label>فعال؟</label><select id="cp_en'+i+'">'+
          '<option value="1"'+(p.enabled!==false?' selected':'')+'>فعال</option>'+
          '<option value="0"'+(p.enabled===false?' selected':'')+'>غیرفعال</option></select></div>'+
        '<div class="field"><label>قیمت</label><input id="cp_p'+i+'" type="number" min="0" value="'+(Number(p.price)||0)+'"'+(p.free?' disabled':'')+'></div>'+
        '<div class="field"><label>واحد فروش</label><select id="cp_c'+i+'"'+(p.free?' disabled':'')+'>'+
          '<option value="coins"'+(p.currency!=='cash'?' selected':'')+'>سکه</option>'+
          '<option value="cash"'+(p.currency==='cash'?' selected':'')+'>نقدی (تومان)</option></select></div>'+
        '<div class="field"><label>ترتیب نمایش</label><input id="cp_s'+i+'" type="number" value="'+(Number(p.sortOrder)||0)+'"></div>'+
        '<div class="field" style="align-self:end"><button class="btn dan" onclick="cpRemove('+i+')">حذف این گروه</button></div>'+
      '</div>'+
      '<div class="field" style="margin-top:10px"><label>جمله‌ها — هر خط یک جمله (حداکثر '+fa(CP_MAX.phrases)+' خط، هر خط تا '+fa(CP_MAX.length)+' نویسه)</label>'+
        '<textarea id="cp_t'+i+'" rows="9" style="width:100%;font-family:inherit" oninput="cpCount('+i+')">'+esc((p.phrases||[]).join('\n'))+'</textarea>'+
        '<small id="cp_ct'+i+'" style="display:block;color:var(--muted);font-size:11px;margin-top:4px">'+fa((p.phrases||[]).length)+' جمله</small></div>'+
    '</div>').join('');
  b.innerHTML=
    '<div class="card"><div class="note">حداقل یک گروه باید <b>رایگان و فعال</b> باشد؛ وگرنه بازیکن تازه‌وارد هیچ جمله‌ای برای فرستادن ندارد و دکمهٔ چت روی صفحهٔ خالی باز می‌شود. گروه فروشی هم نمی‌تواند قیمت صفر داشته باشد — یا رایگانش کن یا قیمت بگذار.<br>شناسهٔ هر گروه (<span class="sub">key</span>) ثابت می‌ماند: مالکیتِ خریدارها روی همان ذخیره شده، پس تغییر نام آزاد است ولی شناسه نه. حذف یک گروه، خریدِ خریدارانش را هم پاک می‌کند.</div></div>'+
    cards+
    '<div style="margin:14px 0"><button class="btn pri" onclick="cpSave()">ذخیرهٔ همه</button> '+
    '<button class="btn" onclick="cpAdd()">+ گروه تازه</button> '+
    '<button class="btn" onclick="renderChatPacks()">بازخوانی</button></div>';
}
/* Read the form back into CP_PACKS. Every redraw goes through this first, so an
   edit typed into one card is never lost by touching another. */
function cpCollect(){
  CP_PACKS=CP_PACKS.map((p,i)=>{
    const free=$('#cp_f'+i).value==='1';
    return {
      key:p.key,
      name:$('#cp_n'+i).value.trim()||p.key,
      emoji:$('#cp_e'+i).value.trim()||'💬',
      free,
      enabled:$('#cp_en'+i).value==='1',
      price:free?0:Math.max(0,parseInt($('#cp_p'+i).value,10)||0),
      currency:$('#cp_c'+i).value==='cash'?'cash':'coins',
      sortOrder:parseInt($('#cp_s'+i).value,10)||0,
      phrases:$('#cp_t'+i).value.split('\n').map(s=>s.trim()).filter(Boolean)
    };
  });
  return CP_PACKS;
}
function cpSync(i){ cpCollect(); cpDraw(); }
function cpCount(i){
  const n=$('#cp_t'+i).value.split('\n').map(s=>s.trim()).filter(Boolean).length;
  const el=$('#cp_ct'+i); if(el) el.textContent=fa(n)+' جمله'+(n>CP_MAX.phrases?' — بیشتر از سقف؛ اضافه‌ها ذخیره نمی‌شوند':'');
}
function cpRemove(i){
  cpCollect();
  if(!confirm('گروه «'+CP_PACKS[i].name+'» حذف شود؟ خریدِ کسانی که آن را خریده‌اند هم پاک می‌شود.')) return;
  CP_PACKS.splice(i,1); cpDraw();
}
function cpAdd(){
  cpCollect();
  const key=(prompt('شناسهٔ انگلیسی گروه تازه (مثلاً sport):','')||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  if(!key) return;
  if(CP_PACKS.some(p=>p.key===key)){ toast('این شناسه از قبل هست','err'); return; }
  CP_PACKS.push({key,name:key,emoji:'💬',free:false,enabled:true,price:1000,currency:'coins',
    sortOrder:CP_PACKS.length+1,phrases:[]});
  cpDraw();
}
async function cpSave(){
  const packs=cpCollect();
  try{
    const d=await api('PUT','/admin/chat-packs',{packs});
    CP_PACKS=(d.packs||[]).map(p=>({...p,phrases:[...(p.phrases||[])]}));
    cpDraw(); toast('پک‌های چت ذخیره شد','ok');
  }catch(e){ toast(e.message||'خطا در ذخیره','err'); }
}

async function renderRecordMode(){
  $('#main').innerHTML=head('ثبت رکورد','ورود، مصرف قلب، و اینکه چقدر روی بقیهٔ بازی اثر بگذارد')+
    '<div id="rcBody"><div class="skel"></div></div>';
  const b=$('#rcBody');
  try{
    RM_CFG=await api('GET','/admin/record');
    let HC={max:5,rechargeMinutes:60};
    try{ HC=await api('GET','/admin/hearts'); }catch(e){}
    const c=RM_CFG;
    const num=(id,label,val,hint)=>'<div class="field"><label>'+label+'</label>'+
      '<input id="'+id+'" type="number" min="0" value="'+(val|0)+'">'+
      (hint?'<small style="display:block;color:var(--muted);font-size:11px;margin-top:4px">'+hint+'</small>':'')+'</div>';
    b.innerHTML=
      '<div class="card"><h3>🏅 وضعیت</h3><div class="grid g4">'+
        '<div class="field"><label>حالت ثبت رکورد</label><select id="rc_en">'+
          '<option value="1"'+(c.enabled?' selected':'')+'>روشن</option>'+
          '<option value="0"'+(!c.enabled?' selected':'')+'>خاموش</option></select></div>'+
        '<div class="field"><label>در کدام پلن دیده شود</label><select id="rc_fo">'+
