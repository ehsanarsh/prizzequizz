/* ── MISSIONS ─────────────────────────────────────────────────────────────
   Every mission is a row. A new mission, a seasonal event, a change of reward
   — all of it happens here, which is the point: a game meant to run for years
   cannot ship its missions inside the app. */
let MS_ROWS=[], MS_METRICS=[], MS_KIND='daily';
const MS_KINDS=[['daily','روزانه'],['weekly','هفتگی'],['achievement','پیشرفت'],['skill','مهارتی'],
  ['social','اجتماعی'],['economy','اقتصادی'],['record','ثبت رکورد'],['streak','استریک'],
  ['event','مناسبتی'],['chain','زنجیره‌ای']];
const MS_RARITY=[['common','🟢 معمولی'],['rare','🔵 کمیاب'],['epic','🟣 حماسی'],
  ['legendary','🟠 افسانه‌ای'],['mythic','👑 اسطوره‌ای']];
const MS_REWARD_TYPES=[['coins','🪙 سکه'],['xp','⚡ XP'],['heart','❤️ قلب'],['ticket','🎫 بلیت'],
  ['cash','💰 تومان'],['lifeline','🧩 کمک'],['spin','🎡 چرخش'],['cosmetic','✨ ظاهری']];

async function renderMissions2(){
  const tabs=MS_KINDS.map((k)=>'<button class="btn sm '+(MS_KIND===k[0]?'pri':'')+
    '" onclick="MS_KIND=\''+k[0]+'\';renderMissions2()">'+k[1]+'</button>').join(' ');
  $('#main').innerHTML=head('مأموریت‌ها','هر مأموریت یک ردیف داده است — افزودن، تغییر جایزه یا رویداد فصلی بدون انتشار نسخهٔ جدید',tabs)+
    '<div id="msBody"><div class="skel"></div></div>';
  try{
    const d=await api('GET','/admin/missions');
    MS_ROWS=d.rows||[]; MS_METRICS=d.metrics||[];
    msPaint();
  }catch(e){ $('#msBody').innerHTML='<div class="card empty">'+esc(e.message||'خطا')+'</div>'; }
}
function msRewardText(rs){
  if(!rs||!rs.length) return '—';
  const nm={coins:'سکه',xp:'XP',heart:'قلب',ticket:'بلیت',cash:'تومان',lifeline:'کمک',spin:'چرخش',cosmetic:'ظاهری'};
  return rs.map((r)=>fa(r.amount)+' '+(nm[r.type]||r.type)+(r.target?(' '+esc(r.target)):'')).join(' + ');
}
function msPaint(){
  const rows=MS_ROWS.filter((r)=>r.kind===MS_KIND);
  const counts=MS_KINDS.map((k)=>k[1]+': '+fa(MS_ROWS.filter((r)=>r.kind===k[0]).length)).join(' · ');
  $('#msBody').innerHTML=
    '<div class="note">مجموع '+fa(MS_ROWS.length)+' مأموریت — '+counts+'</div>'+
    '<div class="note">«شاخص» همان چیزی است که بازی می‌شمارد. مأموریتی با شاخصی که هیچ‌جا گزارش نمی‌شود، برای همیشه روی صفر می‌ماند — برای همین موقع ذخیره بررسی می‌شود. «شانس» فقط برای روزانه و هفتگی معنی دارد: صفر یعنی هرگز در قرعهٔ روزانه نمی‌آید.</div>'+
    tbl(['آیکن','عنوان','شاخص','دامنه','هدف','کمیابی','جایزه','سطح','شانس','فعال',''],
      rows.map((r,i)=>[
        esc(r.icon),
        '<div><b>'+esc(r.title)+'</b>'+(r.chainId?('<div class="sub">زنجیره: '+esc(r.chainId)+' · مرحلهٔ '+fa(r.chainStep)+'</div>'):'')+'</div>',
        '<span class="mono">'+esc(r.metric)+'</span>',
        esc(r.scope||'—'),
        fa(r.target),
        (MS_RARITY.find((x)=>x[0]===r.rarity)||['','—'])[1],
        msRewardText(r.rewards),
        (r.minLevel||r.maxLevel)?(fa(r.minLevel||0)+'–'+fa(r.maxLevel||0)):'همه',
        fa(r.weight),
        r.enabled?'بله':'خیر',
        '<button class="btn sm" onclick="msEdit(\''+jsAttr(r.id)+'\')">ویرایش</button> '+
        '<button class="btn sm" onclick="msDel(\''+jsAttr(r.id)+'\')">حذف</button>'
      ]))+
    '<div style="margin-top:10px"><button class="btn pri" onclick="msEdit(\'\')">＋ مأموریت جدید</button></div>';
}
function jsAttr(v){ return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function msEdit(id){
  const r=MS_ROWS.find((x)=>x.id===id)||{kind:MS_KIND,metric:'matchesPlayed',target:1,icon:'🎯',

      '<div class="field"><label>هدف</label><input id="ms_target" type="number" min="1" value="'+(r.target||1)+'"></div>'+

      '<div class="field"><label>شانس در قرعه</label><input id="ms_weight" type="number" min="0" value="'+(r.weight||0)+'"></div>'+
      '<div class="field"><label>فعال</label><select id="ms_en"><option value="1"'+(r.enabled?' selected':'')+'>بله</option><option value="0"'+(!r.enabled?' selected':'')+'>خیر</option></select></div>'+
      '<div class="field"><label>زنجیره</label><input id="ms_chain" value="'+esc(r.chainId||'')+'"></div>'+
      '<div class="field"><label>مرحلهٔ زنجیره</label><input id="ms_step" type="number" min="0" value="'+(r.chainStep||0)+'"></div>'+
      '<div class="field"><label>شروع رویداد</label><input id="ms_from" type="date" value="'+esc((r.startsAt||'').slice(0,10))+'"></div>'+
      '<div class="field"><label>پایان رویداد</label><input id="ms_to" type="date" value="'+esc((r.endsAt||'').slice(0,10))+'"></div>'+
    '</div>'+
    '<div class="section-title" style="margin-top:10px">جایزه‌ها</div>'+
    '<div class="grid g4">'+rewards.map((rw,i)=>
      '<div class="field"><label>جایزهٔ '+fa(i+1)+'</label>'+
        sel('ms_rt_'+i,MS_REWARD_TYPES,rw.type)+
        '<input id="ms_ra_'+i+'" type="number" min="0" value="'+(rw.amount||0)+'" placeholder="مقدار" style="margin-top:5px">'+
        '<input id="ms_rg_'+i+'" value="'+esc(rw.target||'')+'" placeholder="هدف (green/p5050)" style="margin-top:5px"></div>').join('')+
    '</div>'+
    '<div style="margin-top:12px"><button class="btn pri" onclick="msSave()">ذخیره</button> '+
      '<button class="btn" onclick="this.closest(\'.modal-bg\').remove()">انصراف</button></div>');
}
async function msSave(){
  const rewards=[];
  for(let i=0;i<4;i++){
    const a=+(($('#ms_ra_'+i)||{}).value||0);
    if(a>0) rewards.push({type:($('#ms_rt_'+i)||{}).value,amount:a,target:($('#ms_rg_'+i)||{}).value||''});
  }
  const body={
    id:$('#ms_id').value||undefined, kind:$('#ms_kind').value, metric:$('#ms_metric').value,
    scope:$('#ms_scope').value, target:+$('#ms_target').value||1,
    title:$('#ms_title').value, description:$('#ms_desc').value, icon:$('#ms_icon').value,
    rarity:$('#ms_rarity').value, rewards:rewards, enabled:$('#ms_en').value==='1',
    minLevel:+$('#ms_min').value||0, maxLevel:+$('#ms_max').value||0, weight:+$('#ms_weight').value||0,
    chainId:$('#ms_chain').value, chainStep:+$('#ms_step').value||0,
    startsAt:$('#ms_from').value||'', endsAt:$('#ms_to').value||''};
  if(!rewards.length) return toast('حداقل یک جایزه لازم است','bad');
  try{ await api('POST','/admin/missions',body);
    document.querySelectorAll('.modal-bg').forEach((m)=>m.remove());
    toast('ذخیره شد ✅','ok'); renderMissions2(); }
  catch(e){ toast(e.message||'ذخیره نشد','bad'); }
}
async function msDel(id){
  if(!confirm('این مأموریت حذف شود؟')) return;
  try{ await api('DELETE','/admin/missions/'+encodeURIComponent(id)); toast('حذف شد','ok'); renderMissions2(); }
  catch(e){ toast(e.message||'حذف نشد','bad'); }
}

/* Edits are read out of the form before the list changes, so adding or
   removing a row never throws away what was typed in the others. */
function rwCollect(){
  const w=RW_CFG.wheel, d=RW_CFG.daily;
  const segments=w.segments.map((sg,i)=>({
    id:sg.id,
    icon:($('#rw_icon_'+i)||{}).value||sg.icon,
    label:($('#rw_label_'+i)||{}).value||'',
    color:($('#rw_color_'+i)||{}).value||sg.color,
    type:($('#rw_type_'+i)||{}).value||sg.type,
    amount:+(($('#rw_amount_'+i)||{}).value||0),
    target:($('#rw_target_'+i)||{}).value||'',
    weight:+(($('#rw_weight_'+i)||{}).value||0),
    enabled:($('#rw_en_'+i)||{}).value!=='0'
  }));
  const days=d.days.map((dd,i)=>({
    day:+(($('#rd_day_'+i)||{}).value||dd.day),
    icon:($('#rd_icon_'+i)||{}).value||dd.icon,
    label:($('#rd_label_'+i)||{}).value||'',
    type:($('#rd_type_'+i)||{}).value||dd.type,
    amount:+(($('#rd_amount_'+i)||{}).value||0),
    target:($('#rd_target_'+i)||{}).value||''
  }));
  return {
    wheel:{enabled:($('#rw_wen')||{}).value!=='0',cooldownHours:+(($('#rw_cd')||{}).value||0),
           title:($('#rw_title')||{}).value||w.title,segments:segments},
    daily:{enabled:($('#rw_den')||{}).value!=='0',streakDays:+(($('#rw_sdays')||{}).value||days.length),
           resetOnMiss:($('#rw_reset')||{}).value!=='0',days:days}
  };
}
function rwAddSeg(){
  RW_CFG=rwCollect();
  RW_CFG.wheel.segments.push({id:'seg'+Date.now().toString(36),icon:'🎁',label:'جایزهٔ تازه',
    color:'#D9A02B',type:'coins',amount:100,target:'',weight:10,enabled:true});
  rwRepaint();
}
function rwDelSeg(i){
  RW_CFG=rwCollect();
  if(RW_CFG.wheel.segments.length<=1) return toast('گردونه باید حداقل یک بخش داشته باشد','bad');
  RW_CFG.wheel.segments.splice(i,1); rwRepaint();
}
function rwAddDay(){
  RW_CFG=rwCollect();
  const next=RW_CFG.daily.days.reduce((n,x)=>Math.max(n,x.day),0)+1;
  RW_CFG.daily.days.push({day:next,icon:'🎁',label:'جایزهٔ روز '+fa(next),type:'coins',amount:100,target:''});
  rwRepaint();
}
function rwDelDay(i){
  RW_CFG=rwCollect();
  if(RW_CFG.daily.days.length<=1) return toast('تقویم باید حداقل یک روز داشته باشد','bad');
  RW_CFG.daily.days.splice(i,1);
  RW_CFG.daily.streakDays=Math.min(RW_CFG.daily.streakDays,RW_CFG.daily.days.length);
  rwRepaint();
}
/* The odds column is computed server-side, so it goes stale after a local
   edit until the next save; the header says as much rather than showing a
   number that quietly no longer matches the weights on screen. */
function rwRepaint(){ RW_ODDS={rows:[],perSpin:RW_ODDS.perSpin}; rwPaint(); }

/* Asks the provider about the account rather than spending a message to find
   out whether the key works. Save first — it reads the STORED config. */
async function smsCheckAccount(){
  const box=$('#sm_acct'); if(box)box.innerHTML='<div class="note">در حال بررسی…</div>';
  /* The check reads what is SAVED. Saying so beats letting it answer about the
     previous provider while a different one is picked on screen. */
  const stored=(window._SMS_CFG||{});
  if(stored.provider!==$('#sm_prov').value || $('#sm_apikey').value.trim() || $('#sm_sender').value.trim()!==(stored.sender||'')){
    box.innerHTML='<div class="note" style="border-color:#F1B211">⚠️ اول «ذخیرهٔ تنظیمات» را بزنید؛ این بررسی روی تنظیمات ذخیره‌شده انجام می‌شود.</div>';
    return;
  }
  try{
    const r=await api('GET','/admin/sms/account');
    if(!r.supported){ box.innerHTML='<div class="note">این ارائه‌دهنده بررسی اتصال ندارد.</div>'; return; }
    if(r.error){ box.innerHTML='<div class="note" style="border-color:#E8544F">❌ '+esc(r.error)+'</div>'; return; }
    const senders=(r.senders||[]);
    let s='<div class="note" style="border-color:#2FBF71">✅ اتصال برقرار است و کلید API معتبر است. اعتبار باقی‌مانده: <b>'+fa(r.credit||0)+'</b></div>';
    if(senders.length) s+='<div class="note">خط‌های ارسال این حساب: '+senders.map(x=>'<b class="mono">'+esc(x)+'</b>').join('، ')+'</div>';
    /* Some accounts cannot answer this call at all while sending fine, so it is
       reported as "unavailable", never as a failure. */
    else s+='<div class="note">فهرست خط‌های ارسال از سرویس در دسترس نیست'+(r.sendersError?' ('+esc(r.sendersError)+')':'')+'. اشکالی ندارد — درستی خط «'+esc(r.senderConfigured||'—')+'» با یک پیامک آزمایشی مشخص می‌شود.</div>';
    if(r.senderValid===false) s+='<div class="note" style="border-color:#E8544F">❌ خط ارسال‌کنندهٔ ذخیره‌شده («'+esc(r.senderConfigured||'')+'») در فهرست بالا نیست؛ ارسال با خطای «شماره فرستنده نامعتبر» رد می‌شود.</div>';
    box.innerHTML=s;
  }catch(e){ if(box)box.innerHTML='<div class="note" style="border-color:#E8544F">❌ '+esc(e.message)+'</div>'; }
}

/* ================= SERVER MONITORING ================= */
let MON_TIMER=null;
function monBytes(n){ n=Number(n)||0; if(n<=0)return '۰'; const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return fa(n.toFixed(i>=2?1:0))+' '+u[i]; }
function monUptime(s){ s=Number(s)||0; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?fa(d)+' روز ':'')+(h?fa(h)+' ساعت ':'')+(!d?fa(m)+' دقیقه':''); }
/* SVG speedometer gauge (0–100%). */
function monGauge(pct,label,valTxt){
  pct=Math.max(0,Math.min(100,Number(pct)||0));
  const cx=70,cy=66,r=52, a=Math.PI*(1-pct/100);
  const col=pct>=85?'#F26A6A':(pct>=60?'#FFB020':'#33D97C');
  const pt=(p)=>{const ang=Math.PI*(1-p/100);return [cx+r*Math.cos(ang),cy-r*Math.sin(ang)];};
  const arc=(from,to,color,w)=>{const[x0,y0]=pt(from),[x1,y1]=pt(to);return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;};
  const nx=cx+(r-6)*Math.cos(a),ny=cy-(r-6)*Math.sin(a);
  return `<div style="text-align:center"><svg viewBox="0 0 140 84" style="width:100%;max-width:150px">
    ${arc(0,100,'rgba(255,255,255,.13)',9)}${arc(0,pct,col,9)}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${col}" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy}" r="4.5" fill="${col}"/>
    <text x="${cx}" y="${cy-12}" text-anchor="middle" fill="#fff" font-size="17" font-weight="900">${fa(Math.round(pct))}٪</text>
  </svg><div style="font-size:11px;color:var(--muted);margin-top:-4px">${label}${valTxt?' · '+valTxt:''}</div></div>`;
}
function monSpark(hist,pick,color){
  const vals=(hist||[]).map(pick); if(vals.length<2)return '';
  const max=Math.max(1,...vals),min=Math.min(...vals),w=260,h=40;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*w,h-((v-min)/(max-min||1))*h]);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:44px"><polyline fill="none" stroke="${color}" stroke-width="2" points="${pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(1)).join(' ')}"/></svg>`;
}

          : 'روی آن سرور باید Agent اجرا شود. دستورش را از «مدیریت سرورها» → «📋 دستور» بردار.')+'</div></div>'

    return '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
      '<div><b style="font-size:16px">'+esc(s.name)+'</b> '+(s.host?'<span class="sub mono">'+esc(s.host)+'</span>':'')+(s.tags?' <span class="pill">'+esc(s.tags)+'</span>':'')+'</div>'+
      '<span class="pill '+(never?'':(r.online?'ok':'bad'))+'">'+(never?'بدون گزارش':(r.online?'آنلاین':'آفلاین'))+'</span></div>'+
      gauges+
      '<div class="grid g4" style="margin-top:6px">'+
        stat('Load (۱m)','',fa((m.load1||0).toFixed(2)))+
        stat('آپ‌تایم','',monUptime(m.uptimeSec))+
        stat('آخرین گزارش','',seen)+
        stat('کلید API','','<span class="mono" style="font-size:11px">'+esc(s.apiKeyMask||'—')+'</span>')+
      '</div>'+
      '<div style="margin-top:8px"><button class="btn sm" onclick="monHistory(\''+s.id+'\')">📈 نمودار تاریخچه</button></div>'+
      '<div id="monHist_'+s.id+'"></div></div>';
  }).join('');
}

/* The agent loop, built once so the modal and the "show it again" button can
   never drift apart. */
function monAgentCmd(key){
  const base=(API||'').replace(/\/$/,'');
  return 'API='+base+'/monitor/ingest\nKEY='+key+'\nwhile true; do\n  CPU=$(top -bn1 | awk \'/Cpu/{print 100-$8}\')\n  MT=$(free -b|awk \'/Mem/{print $2}\'); MU=$(free -b|awk \'/Mem/{print $3}\')\n  DT=$(df -B1 /|awk \'NR==2{print $2}\'); DU=$(df -B1 /|awk \'NR==2{print $3}\')\n  L1=$(awk \'{print $1}\' /proc/loadavg); UP=$(awk \'{print int($1)}\' /proc/uptime)\n  curl -s -X POST $API -H "x-monitor-key: $KEY" -H "Content-Type: application/json" -d "{\\"cpuPercent\\":$CPU,\\"memUsed\\":$MU,\\"memTotal\\":$MT,\\"diskUsed\\":$DU,\\"diskTotal\\":$DT,\\"load1\\":$L1,\\"uptimeSec\\":$UP}" >/dev/null\n  sleep 15\ndone';
}
/* Showing the command again, for a server whose key was handed over long ago.
   The key itself is stored hashed, so it genuinely cannot be shown twice —
   this gives the loop with a placeholder and says where a fresh key comes
   from. Before this, the command appeared once at creation and there was no
   way back to it, which reads as «دستوری وجود ندارد». */
function monAgentHelp(id,name){
  const cmd=monAgentCmd('<کلید-این-سرور>');
  modal('📋 دستور Agent'+(name?' — '+esc(name):''),
    '<div class="note">این حلقه را روی <b>آن</b> سرور اجرا کن (نه روی سرور اصلی). سرور اصلی خودش گزارش می‌دهد و به Agent نیاز ندارد.</div>'+
    '<div class="field"><label>دستور</label><textarea readonly onclick="this.select()" style="width:100%;min-height:180px;background:#0d0d10;color:#8fe;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:monospace;font-size:11px;direction:ltr">'+esc(cmd)+'</textarea></div>'+
    '<div class="note" style="color:var(--bad)">کلید فقط یک‌بار هنگام ساخت نشان داده می‌شود و بازیابی نمی‌شود. اگر نداری‌اش، با «کلید جدید» یکی بگیر و <b>همان لحظه</b> در دستور بگذار — کلید قبلی از کار می‌افتد.</div>'+
    (id?'<button class="btn" onclick="monRotate(\''+id+'\')">🔑 کلید جدید بگیر</button>':''));
}
function monShowKey(key,name){
  const cmd=monAgentCmd(key);
  modal('🔑 کلید API'+(name?' — '+esc(name):''),'<div class="note" style="color:var(--bad)">این کلید فقط همین یک‌بار نمایش داده می‌شود؛ کپی‌اش کن.</div>'+
    '<div class="field"><label>کلید</label><input value="'+esc(key)+'" readonly dir="ltr" onclick="this.select()"></div>'+
    '<div class="field"><label>دستور Agent (روی آن سرور اجرا کن)</label><textarea readonly onclick="this.select()" style="width:100%;min-height:180px;background:#0d0d10;color:#8fe;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:monospace;font-size:11px;direction:ltr">'+esc(cmd)+'</textarea></div>');
}

/* Access is granted per screen, not per nav row — merging tabs must not
   silently widen what a limited account can open. Both of these walk the
   opened-out list so a group's four screens stay four separate permissions. */
function tabLabelMap(){const m={};navLeaves().forEach(p=>{if(p[0]!=='accounts')m[p[0]]=p[1]+' '+p[2];});return m;}
function permChecklist(selected){
  const sel=new Set(selected||[]); const all=sel.has('*');
  let html='<label style="display:flex;gap:8px;align-items:center;font-weight:900;margin-bottom:8px"><input type="checkbox" id="perm_all" '+(all?'checked':'')+' onchange="document.querySelectorAll(\'.permchk\').forEach(c=>{c.checked=this.checked;c.disabled=this.checked})"> دسترسی کامل (همهٔ تب‌ها)</label>';
  const leaves=navLeaves().filter(p=>p[0]!=='accounts');
  html+=NAV.map(g=>{
    const items=leaves.filter(p=>p[3]===g[0]);
    if(!items.length)return '';
    return '<div style="margin:8px 0 3px;color:var(--muted);font-size:11px;font-weight:800">'+g[0]+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">'+
      items.map(p=>'<label style="display:flex;gap:6px;align-items:center;font-size:12.5px"><input type="checkbox" class="permchk" value="'+p[0]+'" '+(all||sel.has(p[0])?'checked':'')+' '+(all?'disabled':'')+'>'+p[1]+' '+esc(p[2])+'</label>').join('')+'</div>';
  }).join('');
  return html;
}
function collectPerms(){ if($('#perm_all')&&$('#perm_all').checked)return ['*']; return [...document.querySelectorAll('.permchk:checked')].map(c=>c.value); }

async function renderSuspicious(){
  const d=await api('GET','/admin/suspicious').catch(()=>({rows:[]}));
  const rows=d.rows||[];
  window._SUSP=rows;
  $('#main').innerHTML=head('کاربران مشکوک','فهرست کاملِ هشدارها — شناسه، دلیل، امتیاز ریسک، زمان و جزئیات؛ با امکانِ رسیدگی',
    '<button class="btn sm" onclick="render()">↻ بروزرسانی</button>')+
    '<div class="note">این فهرست از سیگنال‌های تقلبِ باز، سرعتِ غیرعادیِ تراکنش و درخواست‌های ناموفقِ دریافت جایزه ساخته می‌شود و بر اساسِ امتیازِ ریسک مرتب شده است. با «رسیدگی» هر هشدار را تأیید (تقلب) یا رد (بی‌خطر) کن؛ پس از رسیدگی، کاربر از فهرست خارج می‌شود.</div>'+
    tbl(['کاربر','دلیل','امتیاز ریسک','آخرین رویداد','تعداد سیگنال','عملیات'],rows.map((u,i)=>[
      esc(u.username||'')+' <span class="mono" style="color:var(--muted)">'+String(u.userId).slice(0,8)+'</span>'+newTag('suspicious',u.lastAt),
      (u.reasons||[]).map(r=>'<span class="pill '+(String(r).match(/BURST|CRITICAL|multi/i)?'bad':'pend')+'">'+esc(reasonFa(r))+'</span>').join(' '),
      '<b style="color:'+(u.riskScore>=70?'var(--bad)':u.riskScore>=40?'var(--gold)':'var(--muted)')+';font-size:15px">'+fa(u.riskScore||0)+'</b>',
      fmtDate(u.lastAt),fa((u.signals||[]).length),
      '<button class="btn sm info" onclick="suspDetail('+i+')">جزئیات و رسیدگی</button>'
    ]));
}
function reasonFa(r){return ({high_velocity:'سرعتِ بالای تراکنش',failed_withdrawals:'دریافت جایزهٔ ناموفق',REPEATED_QUESTION_ANSWER:'پاسخِ تکراری',ANSWER_BURST:'پاسخِ رگباری',IMPOSSIBLE_ANSWER_TIME:'زمانِ غیرممکن',MULTI_ACCOUNT:'چندحسابی',DEVICE_SHARED_BY_MULTIPLE_USERS:'اشتراکِ دستگاه'}[r])||r;}
function suspDetail(i){
  const u=(window._SUSP||[])[i]; if(!u)return;
  const sig=(u.signals||[]).map(s=>'<div class="card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>'+esc(reasonFa(s.type))+'</b> <span class="pill '+(s.severity==='critical'?'bad':'pend')+'">'+esc(s.severity||'')+'</span> <span class="pill '+(s.status==='open'?'pend':'ok')+'">'+esc(s.status||'')+'</span></div><div class="mono" style="color:var(--muted);font-size:10px">'+fmtDate(s.createdAt)+'</div></div>'+
    (s.metadata?'<div class="mono" style="direction:ltr;text-align:left;font-size:10px;color:var(--muted);margin-top:6px;white-space:pre-wrap;word-break:break-all">'+esc(JSON.stringify(s.metadata))+'</div>':'')+
    (s.status==='open'?'<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm bad" onclick="suspResolve(\''+s.id+'\',\'confirmed\','+i+')">✔ تأیید تقلب</button><button class="btn sm ok" onclick="suspResolve(\''+s.id+'\',\'dismissed\','+i+')">✖ بی‌خطر (رد)</button></div>':'<div style="margin-top:8px;color:var(--muted);font-size:11px">رسیدگی‌شده</div>')+
    '</div>').join('')||'<div class="empty">این کاربر سیگنالِ تقلبِ ثبت‌شده‌ای ندارد؛ هشدار از سرعتِ تراکنش یا دریافت جایزهٔ ناموفق است.</div>';
  modal('رسیدگی به کاربر: '+esc(u.username||String(u.userId).slice(0,8)),
    '<div class="grid g2" style="margin-bottom:12px"><div class="stat"><div class="k">امتیاز ریسک</div><div class="v '+(u.riskScore>=70?'bad':'gold')+'">'+fa(u.riskScore||0)+'</div></div>'+
    '<div class="stat"><div class="k">شناسهٔ کاربر</div><div class="v" style="font-size:13px" dir="ltr">'+esc(u.userId)+'</div></div></div>'+
    '<div style="display:flex;gap:6px;margin-bottom:12px"><button class="btn sm bad" onclick="suspBan(\''+u.userId+'\')">🚫 بن کاربر</button><button class="btn sm info" onclick="document.querySelectorAll(\'.modal-bg\').forEach(m=>m.remove());userDetail(\''+u.userId+'\')">مدیریت کامل</button></div>'+
    '<h3 style="font-size:14px;margin:6px 0">سیگنال‌ها و رویدادها</h3>'+sig);
}
async function suspResolve(sid,status,i){try{await api('PATCH','/admin/integrity/signals/'+sid+'/status',{status});toast(status==='confirmed'?'به‌عنوان تقلب تأیید شد':'بی‌خطر علامت خورد','ok');document.querySelectorAll('.modal-bg').forEach(m=>m.remove());await renderSuspicious();}catch(e){toast(e.message,'bad');}}
async function suspBan(uid){if(!confirm('این کاربر بن شود؟'))return;const reason=prompt('علت بن:')||'فعالیت مشکوک';try{await api('PATCH','/admin/users/'+uid+'/status',{status:'banned',reason});toast('کاربر بن شد','ok');document.querySelectorAll('.modal-bg').forEach(m=>m.remove());render();}catch(e){toast(e.message,'bad');}}

async function renderReset(){
  $('#main').innerHTML=head('ابزار ریست','ریستِ هر بخش به‌صورت جداگانه — عملیاتِ حساس نیازمندِ تأییدِ نهایی است')+
    '<div class="note">⚠️ این عملیات‌ها <b>برگشت‌ناپذیر</b>اند و مستقیم روی دیتابیس اثر می‌گذارند. هر ریست در <b>Audit Log</b> ثبت می‌شود (چه کسی، چه بخشی، چند رکورد). مواردِ حساس (صندوق جایزه، تراکنش، تاریخچه، ریستِ کامل) قبلِ اجرا نیازمندِ تایپِ کلمهٔ <span class="mono">RESET</span> هستند.</div>'+
    '<div class="grid g3">'+RESET_AREAS.map(a=>{
      const danger=a[3]; const bcls=danger>=2?'bad':danger>=1?'bad':'';
      const border=danger>=2?'border-color:var(--bad);box-shadow:0 0 0 1.5px var(--bad) inset':danger>=1?'border-color:#5a2020':'';
      return '<div class="card" style="'+border+'"><h3>'+(danger>=2?'☢️ ':danger>=1?'⚠️ ':'♻️ ')+esc(a[1])+'</h3><div style="color:var(--muted);font-size:12px;min-height:34px;line-height:1.6">'+esc(a[2])+'</div><button class="btn '+(bcls||'')+' sm" style="width:100%;margin-top:8px" onclick="doReset(\''+a[0]+'\','+danger+',\''+esc(a[1])+'\')">ریست '+esc(a[1])+'</button></div>';
    }).join('')+'</div>';
}
function doReset(area,danger,label){
  if(danger>=1){
    modal('تأییدِ ریست: '+esc(label),
      '<div class="note" style="background:rgba(255,90,72,.12);border-color:rgba(255,90,72,.4);color:#ffb3aa">این عملیات برگشت‌ناپذیر است و «'+esc(label)+'» را برای <b>همهٔ کاربران</b> پاک می‌کند. برای ادامه، کلمهٔ <b>RESET</b> را تایپ کن.</div>'+
      '<div class="field"><label>تأیید نهایی</label><input id="rs_confirm" placeholder="RESET" dir="ltr" autocomplete="off"></div>'+
      '<div class="field"><label>علت (اختیاری)</label><input id="rs_reason" placeholder="مثلاً پاک‌سازی محیطِ تست"></div>'+
      '<button class="btn bad" onclick="doResetConfirmed(\''+area+'\')">اجرای ریست</button>');
  } else {
    if(!confirm('«'+label+'» برای همهٔ کاربران ریست شود؟'))return;
    runReset(area,'RESET','');
  }
}
async function doResetConfirmed(area){
  const c=($('#rs_confirm').value||'').trim();
  if(c!=='RESET')return toast('برای تأیید باید دقیقاً RESET تایپ شود','bad');
  runReset(area,'RESET',($('#rs_reason').value||'').trim());
}
async function runReset(area,confirm,reason){
  try{const r=await api('POST','/admin/reset',{area,confirm,reason});toast('ریست انجام شد — '+fa(r.affected||0)+' رکورد ('+esc(area)+')','ok');document.querySelectorAll('.modal-bg').forEach(m=>m.remove());}catch(e){toast(e.message,'bad');}
}

/* ================= GENERIC CONFIG EDITOR (Data-Driven) ================= */
/* Auto-builds an editable form for ANY config subtree, so every variable is
   tunable from the panel. Booleans → checkbox, numbers → number, strings →
   text; nested objects recurse; arrays fall back to the raw-JSON editor. */
async function renderConfigSection(key,title){
  if(!CFG)await loadCfg();
  const node=CFG[key];
  let body;
  if(node==null){ body='<div class="empty">این بخش هنوز در config تعریف نشده.</div>'; }
  else if(Array.isArray(node)||hasArrayDeep(node)){
    body='<div class="note">این بخش شاملِ فهرست/آرایه است؛ برای افزودن آیتم (لیگ، مأموریت، محصول، بنر، رویداد و…) مستقیم اینجا JSON را ویرایش کن. خالی بودن یعنی هنوز موردی تعریف نشده (۰).</div>'+
      '<textarea class="json" id="cfg_arr">'+esc(JSON.stringify(node,null,2))+'</textarea>'+
      '<button class="btn pri" style="margin-top:10px" onclick="saveConfigArray(\''+key+'\')">💾 ذخیره</button>';
  } else {
    _CFG_FIELDS=[];
    body='<div class="card">'+buildFields(node,key)+'<button class="btn pri" style="margin-top:12px" onclick="saveConfigForm(\''+key+'\')">💾 ذخیره</button></div>';
  }
  $('#main').innerHTML=head(title,'Data-Driven — تغییر بلافاصله اعمال و ماندگار می‌شود',
    '<button class="btn" onclick="go(\'rawcfg\')">ویرایش خام کل</button>')+body;
}
let _CFG_FIELDS=[];
function hasArrayDeep(o){ if(Array.isArray(o))return true; if(o&&typeof o==='object')return Object.values(o).some(v=>Array.isArray(v)); return false; }
function buildFields(obj,path){
  let html='';
  for(const k of Object.keys(obj)){
    const v=obj[k]; const p=path+'.'+k;
    if(v!==null&&typeof v==='object'&&!Array.isArray(v)){
      html+='<div style="margin:10px 0 4px;font-weight:800;color:var(--gold);font-size:13px">'+esc(k)+'</div>'+buildFields(v,p);
    }else if(Array.isArray(v)){
      html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+' (آرایه — از ویرایش خام)</span></label><input value="'+esc(JSON.stringify(v))+'" disabled></div>';
    }else{
      const id='cf_'+_CFG_FIELDS.length; _CFG_FIELDS.push({id,path:p,type:typeof v});
      if(typeof v==='boolean')html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+'</span></label><input id="'+id+'" type="checkbox" '+(v?'checked':'')+'></div>';
      else if(typeof v==='number')html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+'</span></label><input id="'+id+'" type="number" value="'+v+'"></div>';
      else html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+'</span></label><input id="'+id+'" value="'+esc(v)+'"></div>';
    }
  }
  return html;
}
function setDeep(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]];}o[ks[ks.length-1]]=val;}
async function saveConfigForm(key){
  const patch={};
  for(const f of _CFG_FIELDS){
    const el=$('#'+f.id);if(!el)continue;
    let val; if(f.type==='boolean')val=el.checked; else if(f.type==='number')val=Number(el.value); else val=el.value;
    setDeep(patch,f.path,val);
  }
  try{await api('PATCH','/admin/config',patch);toast('ذخیره و اعمال شد ✅','ok');await loadCfg();render();}catch(e){toast(e.message||'خطا','bad');}
}
async function saveConfigArray(key){
  let val;try{val=JSON.parse($('#cfg_arr').value);}catch(e){return toast('JSON نامعتبر: '+e.message,'bad');}
  const patch={};patch[key]=val;
  try{await api('PATCH','/admin/config',patch);toast('ذخیره شد ✅','ok');await loadCfg();render();}catch(e){toast(e.message,'bad');}
}
async function renderRawCfg(){
  if(!CFG)await loadCfg();
  $('#main').innerHTML=head('ویرایش خام Config','کلِ تنظیمات بازی — هر متغیری اینجا قابل تغییر است')+
    '<div class="note">این JSON کلِ اقتصاد و بالانسِ بازی است. تغییر و ذخیره → بلافاصله اعمال و در دیتابیس ماندگار می‌شود (بعد از ری‌استارت هم می‌ماند). موارد پیاده‌نشده روی ۰/خالی‌اند و در آپدیت فعال می‌شوند.</div>'+
    '<textarea class="json" id="rawjson" style="min-height:60vh">'+esc(JSON.stringify(CFG,null,2))+'</textarea>'+
    '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn pri" onclick="saveRaw()">💾 ذخیرهٔ کامل</button><button class="btn" onclick="loadCfg().then(render)">بازنشانی</button></div>';
}
async function saveRaw(){
  let obj;try{obj=JSON.parse($('#rawjson').value);}catch(e){return toast('JSON نامعتبر: '+e.message,'bad');}
  try{await api('PUT','/admin/config',obj);toast('کل تنظیمات ذخیره شد ✅','ok');await loadCfg();render();}catch(e){toast(e.message||'ذخیره ناموفق (بررسی ساختار modes/economy)','bad');}
}

$('#inApi').value=API;$('#inKey').value=KEY;
/* Stamped before anything can fail: "the panel did not update" has to be
   answerable even when the panel cannot reach the server at all. */
paintBuild();
if(KEY)enterPanel();
