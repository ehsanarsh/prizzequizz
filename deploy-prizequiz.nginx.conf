# /etc/nginx/sites-available/prizequiz
# ---------------------------------------------------------------------------
# One server block for BOTH prizequiz.ir and www.prizequiz.ir, so the two hosts
# can never drift apart and serve different builds — which is exactly what is
# happening right now: the apex is still serving an old prizzequizz-pwa build
# while www serves something else.
#
# Cloudflare sits in front (orange cloud). Two things follow from that:
#   • the visitor's real IP arrives in CF-Connecting-IP, not in the socket
#   • TLS is terminated at Cloudflare, so this origin only needs port 80 open
#     to Cloudflare — but see the note at the bottom about SSL mode.
# ---------------------------------------------------------------------------

# Real visitor IP from Cloudflare. Without this every log line and every
# rate-limit sees a Cloudflare IP instead of the player.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# The WebSocket upgrade dance, as a map so it is correct for non-WS requests too.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # BOTH names on one block. Nothing else is served here.
    server_name prizequiz.ir www.prizequiz.ir;

    root /var/www/prizequiz;
    index index.html;

    # Uploaded avatars are data the API owns, and the game itself is one large
    # HTML file — raise the body limit so a profile photo POST is not rejected.
    client_max_body_size 12m;

    # ---- the API -----------------------------------------------------------
    # Everything under /v1 goes to the API container. This is what makes the
    # same-origin API base in the client work: the page and the API share a
    # host, so there is no CORS and no mixed content under HTTPS.
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (/v1/realtime) rides the same location.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare tells us what the browser actually used; pass it on so the
        # API builds absolute URLs (avatar links) with the right scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # A duel WebSocket must not be culled after the default 60s of quiet.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---- the admin panel ---------------------------------------------------
    location = /pzadmin.html {
        # Never cached: an operator must not be looking at yesterday's panel.
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /pzadmin.html =404;
    }

    # ---- the game ----------------------------------------------------------
    # index.html is a single self-contained file. It must NOT be cached, or
    # players keep the previous build after every deploy.
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Static art (pooli.png, raygan1.png, the stage image …) can cache hard.
    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Anything else falls back to the game rather than a 404 page.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri /index.html;
    }

    access_log /var/log/nginx/prizequiz.access.log;
    error_log  /var/log/nginx/prizequiz.error.log;
}
