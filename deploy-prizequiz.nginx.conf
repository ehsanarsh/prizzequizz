# /etc/nginx/sites-available/prizequiz
# ---------------------------------------------------------------------------
# ONE file for the whole site. It replaces the old `prizzequizz` config, whose
# 443 block proxied the domain to localhost:4173 — the prizzequizz-pwa preview
# server. That is why prizequiz.ir served an old PWA build and crashed in
# practiceEconomy.ts, and why /v1/health answered with HTML instead of JSON.
#
# TLS is terminated HERE with the existing Let's Encrypt certificate, so
# Cloudflare can be set to Full (strict).
# ---------------------------------------------------------------------------

# Real visitor IP from Cloudflare, otherwise every log line is a Cloudflare edge.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --------------------------------------------------------------------------
# Port 80 — redirect to HTTPS, but keep the ACME path reachable.
# The old config redirected everything, which is what silently breaks
# `certbot renew` a couple of months later.
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prizequiz.ir www.prizequiz.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # eNamad checks the domain over plain http as well as https, and its checker
    # does not reliably follow a 301. The ownership file is therefore served
    # directly here instead of being redirected. The pattern is general, so a
    # re-verification with a new code needs no config change. No {n,m} in the
    # pattern: nginx reads { and } as block delimiters, so a regex containing
    # them has to be quoted or it fails to parse at all.
    location ~ ^/[0-9]+\.txt$ {
        root /var/www/prizequiz;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

# --------------------------------------------------------------------------
# The site itself. BOTH names in one block so they can never drift apart
# again — the whole reason the apex and www were showing different things.
# --------------------------------------------------------------------------
server {
    # `http2 on;` is nginx >= 1.25.1 only; this box runs 1.24, where HTTP/2 is
    # a listen parameter. Using the newer form makes `nginx -t` fail outright.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prizequiz.ir www.prizequiz.ir;

    ssl_certificate     /etc/letsencrypt/live/prizequiz.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prizequiz.ir/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/prizequiz;
    index index.html;

    # A profile photo POST plus a large single-file page.
    client_max_body_size 12m;

    # ---- the API ----------------------------------------------------------
    # Same origin as the page, so there is no CORS and nothing for an HTTPS
    # page to be blocked over.
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (/v1/realtime) rides this same location.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A duel socket must survive a quiet stretch.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ---- service workers ---------------------------------------------------
    # A worker is only replaced if the browser can SEE a new copy of its script.
    # Cached at the edge or in the browser, a rogue worker becomes permanent, so
    # these two are never stored anywhere.
    location ~ ^/(sw|pz-sw)\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # ---- admin panel ------------------------------------------------------
    location = /pzadmin.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---- the game ---------------------------------------------------------
    # index.html is one self-contained file and must never be cached, or a
    # deploy does not reach anybody.
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri /index.html;
    }

    access_log /var/log/nginx/prizequiz.access.log;
    error_log  /var/log/nginx/prizequiz.error.log;
}

# --------------------------------------------------------------------------
# api.prizequiz.ir — kept from the old config. Harmless, and useful for
# testing the API without the game in the way.
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name api.prizequiz.ir;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
