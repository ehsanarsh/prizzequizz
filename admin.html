<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrizzeQuizz — پنل مدیریت</title>
<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d2230;--line:#2a3040;--ink:#e7ecf3;--muted:#8b94a7;--gold:#ffd21f;--ok:#33d97c;--bad:#ff5a48;--info:#5db7ec;--accent:#7b8bff;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,system-ui,sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:#0c0f16;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 10px;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{width:auto}
.hidden{display:none!important}
.btn{border:1.5px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);padding:8px 13px;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:linear-gradient(180deg,#ffe24a,#f5b90d);color:#1a1400;border-color:#000}
.btn.ok{background:var(--ok);color:#062611;border-color:#000}.btn.bad{background:var(--bad);color:#2a0500;border-color:#000}.btn.info{background:var(--info);color:#03202f;border-color:#000}
.btn.sm{padding:5px 8px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.45}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:30px;width:100%;max-width:400px}
.login-card h1{margin:0 0 4px;font-size:22px}.login-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
#shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--panel);border-left:1.5px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.brand{font-size:16px;font-weight:900;padding:6px 10px 12px}.brand small{color:var(--muted);font-weight:600;font-size:10px;display:block}
.navgroup{font-size:10px;color:var(--muted);font-weight:800;padding:12px 10px 5px;letter-spacing:.5px}
.nav button{display:flex;align-items:center;gap:9px;text-align:right;background:none;border:none;color:var(--muted);padding:8px 10px;border-radius:8px;font-size:13px;font-weight:700;width:100%}
.nav button.active{background:var(--panel2);color:var(--ink)}
.nav button:hover{color:var(--ink)}
.nav .ico{width:18px;text-align:center}
main{padding:22px 24px;overflow:auto;max-height:100vh}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:19px}.head .sub{color:var(--muted);font-size:12px;margin-top:2px}
.grid{display:grid;gap:13px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){#shell{grid-template-columns:1fr}aside{position:static;height:auto}.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:15px}
.card h3{margin:0 0 11px;font-size:14.5px}
.stat{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:var(--r);padding:15px}
.stat .k{color:var(--muted);font-size:11.5px;font-weight:700}.stat .v{font-size:23px;font-weight:900;margin-top:5px}
.v.gold{color:var(--gold)}.v.ok{color:var(--ok)}.v.bad{color:var(--bad)}.v.info{color:var(--info)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:11px;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow:auto;border-radius:10px;border:1.5px solid var(--line);max-height:62vh}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:800;border:1.5px solid #000}
.pill.pend{background:#3a3320;color:#ffd67a}.pill.ok{background:#0f3323;color:#5cffa8}.pill.bad{background:#3a1512;color:#ff8f82}.pill.info{background:#0e2c3d;color:#8fd6ff}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:140px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;bottom:30px}.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--muted);font-weight:700}
.note{background:rgba(123,139,255,.1);border:1.5px solid rgba(123,139,255,.3);border-radius:10px;padding:11px 13px;font-size:12px;color:#b9c2ff;margin-bottom:14px;line-height:1.7}
.cfg-row{display:grid;grid-template-columns:1fr 180px;gap:10px;align-items:center;margin-bottom:7px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cfg-row label{font-size:12.5px;color:var(--ink)}.cfg-row .path{font-size:10px;color:var(--muted);direction:ltr;text-align:right;display:block}
textarea.json{min-height:300px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;white-space:pre;direction:ltr;text-align:left}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;padding:14px}
.modal{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
.skel{height:48px;border-radius:9px;margin-bottom:8px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700}
.subtabs button.active{background:var(--gold);color:#1a1400;border-color:#000}
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <h1>⚡ پنل مدیریت</h1><p>PrizzeQuizz — کنترل کامل و Data-Driven</p>
    <div class="field"><label>آدرس API</label><input id="inApi" placeholder="https://دامنه/v1" dir="ltr"></div>
    <div class="field"><label>نام کاربری</label><input id="inUser" placeholder="owner" dir="ltr" autocomplete="username"></div>
    <div class="field"><label>رمز عبور</label><input id="inPass" type="password" placeholder="••••••••" dir="ltr" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn pri" style="width:100%;margin-top:6px" onclick="doLogin()">ورود</button>
    <div style="text-align:center;margin-top:10px"><a onclick="document.getElementById('keyWrap').style.display='block';this.style.display='none'" style="color:var(--muted);font-size:12px;cursor:pointer">ورود با کلید اصلی (پیشرفته)</a></div>
    <div class="field" id="keyWrap" style="display:none;margin-top:8px"><label>کلید اصلی (ADMIN_KEY)</label><input id="inKey" type="password" placeholder="ADMIN_KEY" dir="ltr"></div>
    <p id="loginErr" style="color:var(--bad);margin:12px 0 0;font-size:12px"></p>
    <p style="color:var(--muted);font-size:11px;margin-top:10px">اولین ورود: نام کاربری <b>owner</b> و رمز = همان کلید اصلیِ سرور. بعد از ورود می‌توانی رمز را عوض کنی و برای دیگران حساب بسازی.</p>
  </div>
</section>

<section id="shell" class="hidden">
  <aside>
    <div class="brand">⚡ Prizze Admin<small id="cfgVer"></small></div>
    <nav class="nav" id="nav"></nav>
    <button class="btn" style="width:100%;margin-top:14px;color:var(--bad)" onclick="logout()">خروج</button>
  </aside>
  <main id="main"></main>
</section>
<div class="toast" id="toast"></div>

<script>
let API=localStorage.getItem('pz_admin_api')||(location.origin+'/v1');
let KEY=localStorage.getItem('pz_admin_key')||'';
let CFG=null;
const $=(s,r=document)=>r.querySelector(s);
function fa(n){return (Number(n)||0).toLocaleString('fa-IR');}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');clearTimeout(toast._t);toast._t=setTimeout(()=>e.className='toast',2800);}
function fmtDate(d){if(!d)return '—';try{return new Date(d).toLocaleString('fa-IR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
async function api(method,path,body){
  const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json','x-admin-key':KEY},body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json();}catch(e){}
  if(r.status===403)throw (d&&d.error)||{code:'FORBIDDEN',message:'دسترسی مجاز نیست'};
  if(!r.ok)throw (d&&d.error)||{message:'خطای '+r.status};
  return d&&d.data!==undefined?d.data:d;
}
let PERMS=['*'], IS_OWNER=true, ME_USER='';
function canTab(k){ return PERMS.indexOf('*')>=0 || PERMS.indexOf(k)>=0; }
async function doLogin(){
  API=($('#inApi').value||'').trim().replace(/\/$/,'')||API;
  const key=($('#inKey')&&$('#inKey').value||'').trim();
  const user=($('#inUser').value||'').trim(), pass=($('#inPass').value||'');
  $('#loginErr').textContent='';
  try{
    if(key){ KEY=key; }                         // advanced: direct master key
    else {
      if(!user||!pass){$('#loginErr').textContent='نام کاربری و رمز را وارد کن';return;}
      const r=await fetch(API+'/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
      const d=await r.json().catch(()=>null);
      if(!r.ok){$('#loginErr').textContent=(d&&d.error&&d.error.message)||'ورود ناموفق';return;}
      KEY=(d&&d.data&&d.data.token)||(d&&d.token);
    }
    localStorage.setItem('pz_admin_api',API);localStorage.setItem('pz_admin_key',KEY);
    await enterPanel();
  }catch(e){$('#loginErr').textContent=e.message||'ورود ناموفق';}
}
async function enterPanel(){
  try{ await loadMe(); }catch(e){ showLogin((e&&e.message)||'نشست منقضی شده؛ دوباره وارد شو'); return false; }
  $('#login').classList.add('hidden');$('#shell').classList.remove('hidden');
  await loadCfg(); buildNav();
  // land on the first tab this account may actually see
  const first=(NAV.flatMap(g=>g[1]).map(p=>p[0]).filter(canTab))[0]||'dashboard';
  go(canTab('dashboard')?'dashboard':first);
  return true;
}
function showLogin(msg){ $('#shell').classList.add('hidden'); $('#login').classList.remove('hidden'); if(msg)$('#loginErr').textContent=msg; }
async function loadMe(){ const me=await api('GET','/admin/auth/me'); PERMS=me.perms||['*']; IS_OWNER=!!me.isOwner; ME_USER=me.username||''; }
function logout(){localStorage.removeItem('pz_admin_key');location.reload();}
async function loadCfg(){ try{ CFG=await api('GET','/admin/config'); $('#cfgVer').textContent='config '+(CFG.version||''); }catch(e){ CFG={}; } }

/* ---- nav: 25 sections grouped ---- */
const NAV=[
  ['اصلی',[['dashboard','📊','داشبورد'],['finance','💰','داشبورد مالی'],['users','👤','کاربران'],['matches','🎮','مسابقات'],['lastsurvivor','🏆','آخرین بازمانده'],['support','🎧','پشتیبانی']]],
  ['محتوا',[['questions','❓','سوالات'],['qreports','🚩','گزارش سؤالات'],['aistudio','🤖','استودیوی سوال (AI)'],['pipeline','🔬','خط‌لولهٔ کیفیت'],['categories','🏷️','موضوعات'],['characterbuilder','🎭','قطعات کاراکتر']]],
  ['اقتصاد',[['wallet','👛','کیف پول'],['withdrawals','💸','برداشت‌ها'],['rewardholds','⏳','جوایز در انتظار'],['tickets','🎫','بلیط‌ها'],['shop','🛒','فروشگاه'],['giftcodes','🎁','کدهای هدیه'],['payments','🏦','درگاه پرداخت']]],
  ['بالانس بازی (Data-Driven)',[['cfg_xp','✨','XP'],['cfg_level','🏅','Level'],['cfg_cup','🏆','Cup'],['cfg_gameplay','🕹️','گیم‌پلی مودها'],['leagues','🛡️','لیگ‌ها'],['missions','🎯','مأموریت‌ها'],['rewards','🎉','جوایز/چرخونه/استریک']]],
  ['رشد و تعامل',[['leaderboard','📈','لیدربرد'],['campaign','🎁','کمپین کاربر جدید'],['events','📅','رویدادها'],['banners','🖼️','بنرها'],['notifications','🔔','اعلان‌ها'],['sms','📱','پنل پیامکی']]],
  ['سیستم',[['anticheat','🛡️','ضدتقلب'],['suspicious','🚨','کاربران مشکوک'],['reports','📑','گزارش‌ها'],['logs','📝','لاگ و Audit'],['reset','♻️','ابزار ریست'],['accounts','🔐','حساب‌ها و دسترسی'],['general','⚙️','تنظیمات عمومی'],['rawcfg','🧩','ویرایش خام Config']]]
];
function buildNav(){
  $('#nav').innerHTML=NAV.map(g=>{
    // Only show tabs this account may access; 'accounts' is owner-only.
    const items=g[1].filter(p=>(p[0]==='accounts'?IS_OWNER:canTab(p[0])));
    if(!items.length)return '';
    return '<div class="navgroup">'+g[0]+'</div>'+items.map(p=>'<button data-p="'+p[0]+'" onclick="go(\''+p[0]+'\')"><span class="ico">'+p[1]+'</span>'+p[2]+'</button>').join('');
  }).join('');
}
let CUR='dashboard';
function go(p){CUR=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render();}
function loading(){$('#main').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';}
function head(t,s,r){return '<div class="head"><div><h2>'+t+'</h2>'+(s?'<div class="sub">'+s+'</div>':'')+'</div><div>'+(r||'')+'</div></div>';}
function stat(k,cls,v){return '<div class="stat"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>';}
function tbl(cols,rows){if(!rows||!rows.length)return '<div class="empty">داده‌ای نیست</div>';return '<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function modal(title,html){const bg=document.createElement('div');bg.className='modal-bg';bg.onclick=e=>{if(e.target===bg)bg.remove();};bg.innerHTML='<div class="modal"><div class="head"><h2 style="font-size:16px">'+title+'</h2><button class="btn sm" onclick="this.closest(\'.modal-bg\').remove()">✕</button></div>'+html+'</div>';document.body.appendChild(bg);return bg;}
const CONFIG_PAGES={cfg_xp:['xp','تنظیمات XP'],cfg_level:['level','تنظیمات Level'],cfg_cup:['cup','تنظیمات Cup'],cfg_gameplay:['gameplay','گیم‌پلی هر مود'],leagues:['leagues','مدیریت لیگ‌ها'],missions:['missions','مأموریت‌ها'],rewards:['rewards','جوایز/چرخونه/استریک'],events:['events','رویدادها'],banners:['banners','بنرها'],general:['general','تنظیمات عمومی'],anticheat:['antiCheat','ضدتقلب'],campaign:['campaign','کمپین کاربر جدید']};

async function render(){
  loading();
  // Access guard: block sections this account isn't permitted to see.
  if(CUR==='accounts'){ if(!IS_OWNER){$('#main').innerHTML=head('دسترسی محدود')+'<div class="card empty">فقط مدیر کل به این بخش دسترسی دارد.</div>';return;} }
  else if(!canTab(CUR)){ $('#main').innerHTML=head('دسترسی محدود')+'<div class="card empty">به این بخش دسترسی نداری. از مدیر کل بخواه دسترسی این تب را فعال کند.</div>';return; }
  try{
    if(CUR==='accounts')return renderAccounts();
    if(CONFIG_PAGES[CUR])return renderConfigSection(CONFIG_PAGES[CUR][0],CONFIG_PAGES[CUR][1]);
    const fn={dashboard:renderDashboard,finance:renderFinance,users:renderUsers,matches:renderMatches,support:renderSupport,questions:renderQuestions,qreports:renderQReports,aistudio:renderAiStudio,pipeline:renderPipeline,categories:renderCategories,wallet:renderWallet,withdrawals:renderWithdrawals,rewardholds:renderRewardHolds,tickets:renderTickets,giftcodes:renderGiftCodes,shop:renderShopAdmin,characterbuilder:renderCharParts,lastsurvivor:renderLastSurvivor,sms:renderSms,payments:renderPayments,leaderboard:renderLeaderboard,notifications:renderNotifications,anticheat:renderAntiCheat,suspicious:renderSuspicious,reports:renderReports,logs:renderLogs,reset:renderReset,roles:renderRoles,rawcfg:renderRawCfg}[CUR];
    if(fn)return fn();
  }catch(e){$('#main').innerHTML=head('خطا')+'<div class="card empty">'+(e.message||'خطا')+'</div>';}
}

/* ================= DASHBOARD ================= */
function miniBars(series,color,label){
  const arr=(series||[]).map(p=>Number(p.c)||0); if(!arr.length)return '<div class="empty">داده‌ای نیست</div>';
  const max=Math.max(1,...arr); const w=Math.max(6,Math.floor(560/arr.length)-2);
  const total=arr.reduce((a,b)=>a+b,0);
  const bars=arr.map((v,i)=>{const h=Math.round((v/max)*90)+2;const day=(series[i].day||'');
    return '<div onclick="toast(\''+esc(day)+' — '+fa(v)+' '+esc(label||'')+'\',\'ok\')" title="'+esc(day)+': '+fa(v)+'" style="display:inline-block;width:'+w+'px;height:'+h+'px;background:'+color+';border-radius:3px 3px 0 0;margin-left:1px;vertical-align:bottom;cursor:pointer" onmouseover="this.style.filter=\'brightness(1.3)\'" onmouseout="this.style.filter=\'\'"></div>';}).join('');
  return '<div style="height:104px;white-space:nowrap;overflow-x:auto;direction:ltr;text-align:left;padding-top:6px">'+bars+'</div><div style="font-size:10px;color:var(--muted);direction:ltr;text-align:left;margin-top:4px">'+esc((series[0]||{}).day||'')+' … '+esc((series[series.length-1]||{}).day||'')+' · مجموع '+fa(total)+' · بیشینه '+fa(max)+' — (روی هر ستون بزن)</div>';
}
function fmtDur(s){s=Number(s)||0;if(s<=0)return '—';const m=Math.floor(s/60),ss=Math.round(s%60);return m?m+'د '+ss+'ث':ss+'ث';}
async function renderDashboard(){
  const d=await api('GET','/admin/dashboard').catch(e=>({error:e.message}));
  if(d.error){$('#main').innerHTML=head('داشبورد')+'<div class="card empty">خطا: '+esc(d.error)+'</div>';return;}
  const money=v=>fa(v)+' ت';
  $('#main').innerHTML=head('داشبورد اصلی','نمای کلیِ زندهٔ سیستم — مستقیم از دیتابیس','<button class="btn sm" onclick="render()">↻ بروزرسانی</button>')+
    (d.note?'<div class="note">⚠️ '+esc(d.note)+'</div>':'')+
    '<div class="grid g4" style="margin-bottom:13px">'+
      stat('کاربرانِ ثبت‌نام‌شده','',fa(d.registeredUsers))+
      stat('آنلاین (۵ دقیقه)','ok',fa(d.onlineUsers))+
      stat('فعالِ امروز (DAU)','info',fa(d.dau))+
      stat('کاربرِ جدیدِ امروز','gold',fa(d.newUsersToday))+
    '</div>'+
    '<div class="grid g4" style="margin-bottom:13px">'+
      stat('مسابقاتِ امروز','',fa(d.matchesToday))+
      stat('در حالِ اجرا','info',fa(d.runningMatches))+
      stat('میانگینِ زمانِ مسابقه','',fmtDur(d.avgMatchSec))+
      stat('درآمدِ امروز','gold',money(d.todayRevenue))+
    '</div>'+
    '<div class="grid g4" style="margin-bottom:13px">'+
      stat('برداشتِ در انتظار','bad',fa(d.pendingWithdrawals)+' ('+money(d.pendingWithdrawAmount)+')')+
      stat('تیکتِ پشتیبانیِ باز','pend',fa(d.openTickets))+
      stat('RAM سرور (پروسه)',(d.system&&d.system.ramUsedMB>800?'bad':'ok'),fa(d.system?d.system.ramUsedMB:0)+' MB')+
      stat('آپ‌تایم','',(d.system?d.system.uptimeH:0)+' ساعت')+
    '</div>'+
    '<div class="grid g2">'+

function uSelOne(id,on){ if(on)_USEL.add(id); else _USEL.delete(id); uBulkBar(); }
function uSelAll(on){ (window._UALL||[]).forEach(u=>on?_USEL.add(u.id):_USEL.delete(u.id)); document.querySelectorAll('.usel').forEach(c=>c.checked=on); uBulkBar(); }
function uBulkBar(){
  const el=$('#ubulk'); if(!el)return; const n=_USEL.size;
  el.innerHTML=n?'<div class="card" style="border-color:var(--gold);margin-bottom:12px"><b>'+fa(n)+' کاربر انتخاب شد</b>'+

    '<button class="btn sm ok" onclick="uBulk(\'ticket_add\')">➕ بلیط</button><button class="btn sm bad" onclick="uBulk(\'ticket_sub\')">➖ بلیط</button>'+
    '<button class="btn sm ok" onclick="uBulk(\'xp_add\')">➕ XP</button><button class="btn sm bad" onclick="uBulk(\'xp_sub\')">➖ XP</button>'+
    '<button class="btn sm info" onclick="uBulk(\'notify\')">🔔 اعلان</button>'+
    '<button class="btn sm bad" onclick="uBulk(\'ban\')">🚫 بن</button><button class="btn sm" onclick="uBulk(\'unban\')">✅ آن‌بن</button>'+
    '<button class="btn sm" onclick="_USEL.clear();render()">لغو</button>'+
    '</div></div>':'';
}
async function uBulk(action){
  const ids=[..._USEL]; if(!ids.length)return;
  const users=(window._UALL||[]);
  let amount=0,tier='green',msg='';
  if(action.startsWith('wallet')){amount=Number(prompt('مبلغِ '+(action==='wallet_add'?'افزودن':'کسر')+' به تومان:','50000'));if(!amount)return;if(action==='wallet_sub')amount=-Math.abs(amount);else amount=Math.abs(amount);}
  if(action.startsWith('ticket')){tier=prompt('نوع بلیط (green/blue/red/bronze/silver/gold):','green')||'green';const cnt=Number(prompt('تعداد:','1'));if(!cnt)return;amount=action==='ticket_sub'?-Math.abs(cnt):Math.abs(cnt);}
  if(action.startsWith('xp')){const x=Number(prompt('مقدارِ XP:','100'));if(!x)return;amount=action==='xp_sub'?-Math.abs(x):Math.abs(x);}
  if(action==='notify'){msg=prompt('متنِ اعلان به کاربران:');if(!msg)return;}
  if((action==='ban'||action==='unban')&&!confirm((action==='ban'?'بن':'آن‌بن')+' '+ids.length+' کاربر؟'))return;
  const reason=action.startsWith('wallet')?(prompt('علتِ اصلاحِ موجودی:')||'عملیات گروهی'):'';
  let ok=0,bad=0;
  for(const uid of ids){try{
    if(action.startsWith('wallet'))await api('POST','/admin/wallet/adjust',{userId:uid,amount,reason});
    else if(action.startsWith('ticket'))await api('POST','/admin/users/'+uid+'/tickets',{tier,count:amount,mode:'add'});
    else if(action.startsWith('xp')){const u=users.find(x=>x.id===uid)||{};await api('PATCH','/admin/users/'+uid,{xp:Math.max(0,(Number(u.xp)||0)+amount)});}
    else if(action==='notify')await api('POST','/admin/users/'+uid+'/message',{title:'پیام از پشتیبانی',body:msg});
    else if(action==='ban')await api('PATCH','/admin/users/'+uid+'/status',{status:'banned',reason:'عملیات گروهی'});
    else if(action==='unban')await api('PATCH','/admin/users/'+uid+'/status',{status:'active',reason:''});
    ok++;
  }catch(e){bad++;}}
  _USEL.clear();toast('انجام شد: '+fa(ok)+(bad?' · ناموفق '+fa(bad):''),bad?'bad':'ok');render();
}

function qSelOne(id,on){ if(on)_QSEL.add(id); else _QSEL.delete(id); qBulkBar(); }

function qBulkBar(){

async function qBulk(action){
  const ids=[..._QSEL]; if(!ids.length)return;
  const label={approve:'تأیید',archive:'بایگانی',delete:'حذف'}[action];
  if(!confirm(label+' '+ids.length+' سوالِ انتخاب‌شده؟'+(action==='delete'?' (برگشت‌ناپذیر)':'')))return;
  let ok=0,bad=0;
  for(const id of ids){try{
    if(action==='delete')await api('DELETE','/admin/questions/'+id);
    else await api('PATCH','/admin/questions/'+id+'/status',{status:action==='approve'?'approved':'archived'});
    ok++;
  }catch(e){bad++;}}
  _QSEL.clear();
  toast(label+' شد: '+fa(ok)+(bad?' · ناموفق '+fa(bad):''),bad?'bad':'ok');
  render();
}

      '<div class="grid g3"><div class="field"><label>موضوع</label><input id="ai_topic" placeholder="مثلاً فوتبال"></div>'+

async function aiGen(){
  const out=$('#ai_out'); out.innerHTML='<div class="skel"></div>';
  try{
    const r=await api('POST','/admin/questions/ai/generate',{topic:$('#ai_topic').value.trim(),difficulty:$('#ai_diff').value,count:Number($('#ai_count').value||1)});
    if(!r.configured){ out.innerHTML='<div class="note">🔌 AI پیکربندی نشده (ANTHROPIC_API_KEY تنظیم نیست). فعلاً «ساخت دستی» را بزن یا کلید را روی سرور ست کن.</div>'; return; }
    AI_DRAFTS=r.drafts||[];
    if(!AI_DRAFTS.length){ out.innerHTML='<div class="empty">مدل چیزی تولید نکرد'+(r.error?': '+esc(r.error):'')+'</div>'; return; }
    out.innerHTML=AI_DRAFTS.map((d,i)=>draftCard(d,i)).join('');
  }catch(e){ out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
function aiManual(){ AI_DRAFTS=[{topic:$('#ai_topic').value.trim(),difficulty:$('#ai_diff').value,question:'',options:['','','',''],correctAnswer:0,explanation:''}]; $('#ai_out').innerHTML=draftCard(AI_DRAFTS[0],0,true); }
function draftCard(d,i,edit){
  return '<div class="card" style="margin-bottom:11px"><h3>سوال '+fa(i+1)+' <span class="pill info">'+esc(d.difficulty||'')+'</span></h3>'+
    '<div class="field"><label>متن سوال</label><input id="d_q_'+i+'" value="'+esc(d.question)+'"></div>'+
    '<div class="grid g2">'+d.options.map((o,j)=>'<div class="field"><label>گزینه '+fa(j+1)+(j===d.correctAnswer?' ✅':'')+'</label><input id="d_o_'+i+'_'+j+'" value="'+esc(o)+'"></div>').join('')+'</div>'+
    '<div class="grid g3"><div class="field"><label>ایندکس پاسخ درست</label><input id="d_ci_'+i+'" type="number" value="'+(d.correctAnswer||0)+'"></div>'+
    '<div class="field"><label>موضوع</label><input id="d_cat_'+i+'" value="'+esc(d.topic||'')+'"></div>'+
    '<div class="field"><label>سختی</label><input id="d_diff_'+i+'" value="'+esc(d.difficulty||'medium')+'"></div></div>'+
    '<div class="field"><label>توضیح جواب</label><input id="d_exp_'+i+'" value="'+esc(d.explanation||'')+'"></div>'+
    '<button class="btn pri" onclick="saveDraft('+i+')">💾 ذخیره + اجرای خط‌لوله</button></div>';
}
async function saveDraft(i){
  const opts=[0,1,2,3].map(j=>($('#d_o_'+i+'_'+j)||{}).value||'').filter(x=>x!=='');
  const q={text:$('#d_q_'+i).value.trim(),options:[0,1,2,3].map(j=>$('#d_o_'+i+'_'+j).value.trim()),correctIndex:Number($('#d_ci_'+i).value||0),category:$('#d_cat_'+i).value.trim(),difficulty:$('#d_diff_'+i).value.trim(),explanation:$('#d_exp_'+i).value.trim(),source:AI_DRAFTS[i]&&AI_DRAFTS[i].question?'ai':'manual'};
  if(!q.text||q.options.filter(Boolean).length<2)return toast('متن و حداقل ۲ گزینه لازم است','bad');
  try{
    const saved=await api('POST','/admin/questions/draft',q);
    const m=await api('POST','/admin/questions/'+saved.id+'/pipeline',{autoApprove:false});
    modal('نتیجهٔ خط‌لولهٔ کیفیت',pipelineResultHtml(saved.id,m));
    toast('ذخیره و ارزیابی شد','ok');
  }catch(e){toast(e.message,'bad');}
}
function pipelineResultHtml(qid,m){
  const q=m.quality||{}; const fc=m.factCheck||{}; const dup=m.duplicate||{};
  const bar=(l,v)=>'<div class="cfg-row"><label>'+l+'</label><b style="color:'+(v>=80?'var(--ok)':v>=50?'var(--gold)':'var(--bad)')+'">'+fa(v||0)+'</b></div>';
  return '<div class="card">'+
    bar('امتیاز کیفیت کل',q.total)+bar('دقت (Accuracy)',q.accuracy)+bar('وضوح (Clarity)',q.clarity)+bar('نگارش (Grammar)',q.grammar)+bar('اصالت (Originality)',q.originality)+
    '<div class="cfg-row"><label>تکراری؟</label><b style="color:'+(dup.isDuplicate?'var(--bad)':'var(--ok)')+'">'+(dup.isDuplicate?'بله ('+fa(dup.maxSimilarity)+'٪ شباهت)':'نه ('+fa(dup.maxSimilarity||0)+'٪)')+'</b></div>'+
    '<div class="cfg-row"><label>راستی‌آزمایی</label><b>'+(fc.configured===false?'AI غیرفعال':(fc.verified===false?'❌ مشکوک':fc.verified===true?'✅ تأیید ('+fa(fc.confidence||0)+'٪)':'—'))+'</b></div>'+
    '</div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn ok" onclick="pipeApprove(\''+qid+'\')">✅ تأیید و ورود به بازی</button><button class="btn bad" onclick="pipeReject(\''+qid+'\')">رد</button></div>';
}
async function pipeApprove(qid){try{await api('POST','/admin/questions/'+qid+'/approve');toast('سوال تأیید و فعال شد','ok');document.querySelector('.modal-bg').remove();}catch(e){toast(e.message,'bad');}}
async function pipeReject(qid){try{await api('POST','/admin/questions/'+qid+'/reject');toast('رد شد','ok');document.querySelector('.modal-bg').remove();}catch(e){toast(e.message,'bad');}}

let PL_ST='';
async function renderPipeline(){
  const d=await api('GET','/admin/questions/pipeline'+(PL_ST?'?stage='+PL_ST:'')).catch(()=>({rows:[]}));
  const stages={'':'همه',draft:'پیش‌نویس',reviewed:'بازبینی‌شده',fact_checked:'راستی‌آزمایی',dedup_checked:'ضدتکرار',scored:'امتیازخورده',approved:'تأییدشده',rejected:'ردشده',retired:'خارج‌شده'};
  $('#main').innerHTML=head('خط‌لولهٔ کیفیت سوالات','وضعیت، امتیاز، بازخورد کاربران و خروجِ خودکار')+
    '<div class="subtabs">'+Object.keys(stages).map(s=>'<button class="'+(PL_ST===s?'active':'')+'" onclick="PL_ST=\''+s+'\';render()">'+stages[s]+'</button>').join('')+'</div>'+
    tbl(['سوال','منبع','مرحله','کیفیت','گزارش','بازخورد','عملیات'],(d.rows||[]).map(m=>[
      esc(String((m.question&&m.question.text)||'—').slice(0,45)),
      '<span class="pill '+(m.source==='ai'?'info':'')+'">'+(m.source==='ai'?'AI':'دستی')+'</span>',
      '<span class="pill '+(m.stage==='approved'?'ok':m.stage==='retired'||m.stage==='rejected'?'bad':'pend')+'">'+(stages[m.stage]||m.stage)+'</span>',
      '<b style="color:'+(m.qualityScore>=80?'var(--ok)':'var(--gold)')+'">'+fa(m.qualityScore)+'</b>',
      fa(m.reportCount||0),
      fbSummary(m.feedback),
      '<button class="btn sm" onclick="rerunPipe(\''+m.questionId+'\')">اجرا مجدد</button> <button class="btn sm ok" onclick="pipeApprove(\''+m.questionId+'\')">تأیید</button>'
    ]));
}
function fbSummary(f){if(!f)return '—';const p=[];if(f.tooHard)p.push('سخت'+fa(f.tooHard));if(f.tooEasy)p.push('آسان'+fa(f.tooEasy));if(f.wrongAnswer)p.push('غلط'+fa(f.wrongAnswer));if(f.report)p.push('گزارش'+fa(f.report));return p.join(' · ')||'—';}
async function rerunPipe(qid){try{const m=await api('POST','/admin/questions/'+qid+'/pipeline',{});toast('خط‌لوله اجرا شد — کیفیت '+fa(m.qualityScore),'ok');render();}catch(e){toast(e.message,'bad');}}

let _CATS=null;
async function renderCategories(){
  if(!CFG)await loadCfg();
  _CATS=JSON.parse(JSON.stringify(Array.isArray(CFG.categories)?CFG.categories:[]));
  // Count from the FULL question bank (all statuses), same source as the
  // questions section, so the per-topic counts match what you see there.
  const allQ=await api('GET','/admin/questions').catch(()=>[]);
  const qlist=Array.isArray(allQ)?allQ:(allQ.rows||[]);
  const cmap={}; qlist.forEach(q=>{const c=(q.category||'').trim(); if(c) cmap[c]=(cmap[c]||0)+1;});
  _CATS.sort((a,b)=>(Number(a.order)||99)-(Number(b.order)||99));
  const rows=_CATS.map((c,i)=>
    '<div class="cfg-row" style="grid-template-columns:44px 1fr 90px 90px 120px;align-items:center">'+
      '<input id="cat_ic_'+i+'" value="'+esc(c.icon||'')+'" style="text-align:center;font-size:18px" title="آیکون">'+
      '<input id="cat_nm_'+i+'" value="'+esc(c.name||'')+'" title="نام موضوع">'+
      '<input id="cat_or_'+i+'" type="number" value="'+(c.order||i+1)+'" title="ترتیب">'+
      '<span style="font-size:12px;color:var(--muted)">'+fa(cmap[c.name]||0)+' سوال</span>'+
      '<label style="font-size:12px;display:flex;gap:5px;align-items:center;justify-content:flex-end"><input id="cat_en_'+i+'" type="checkbox" '+(c.enabled!==false?'checked':'')+'> فعال '+
        '<button class="btn sm bad" onclick="catDel('+i+')">حذف</button></label>'+
    '</div>').join('');
  $('#main').innerHTML=head('مدیریت موضوعات',fa(_CATS.length)+' موضوع — فعال/غیرفعال، ترتیب، آیکون','<button class="btn ok" onclick="catAdd()">➕ موضوع جدید</button> <button class="btn pri" onclick="catSave()">💾 ذخیره</button>')+
    '<div class="note">این موضوعات مستقیم روی بازی اثر می‌گذارند: فقط موضوعاتِ <b>فعال</b> در انتخابِ موضوعِ بازی نمایش داده می‌شوند (بازی از config می‌خواند). بعد از ذخیره، در بازی Ctrl+Shift+R بزن.</div>'+
    '<div class="card">'+
      '<div class="cfg-row" style="grid-template-columns:44px 1fr 90px 90px 120px;color:var(--muted);font-size:11px;font-weight:800"><span>آیکون</span><span>نام موضوع</span><span>ترتیب</span><span>سوالات</span><span>وضعیت</span></div>'+
      rows+
      '<button class="btn pri" style="margin-top:12px" onclick="catSave()">💾 ذخیرهٔ همه</button>'+
    '</div>';
}
function catAdd(){ catSyncFromDom(); _CATS.push({name:'موضوع جدید',icon:'❓',enabled:true,order:_CATS.length+1}); renderCatsFromMem(); }
function catDel(i){ catSyncFromDom(); if(!confirm('این موضوع حذف شود؟ (سوالاتش پاک نمی‌شوند)'))return; _CATS.splice(i,1); renderCatsFromMem(); }
function catSyncFromDom(){ _CATS.forEach((c,i)=>{const ic=$('#cat_ic_'+i),nm=$('#cat_nm_'+i),or=$('#cat_or_'+i),en=$('#cat_en_'+i); if(ic)c.icon=ic.value; if(nm)c.name=nm.value.trim(); if(or)c.order=Number(or.value)||i+1; if(en)c.enabled=en.checked;}); }
function renderCatsFromMem(){ CFG.categories=_CATS; renderCategories(); }
async function catSave(){
  catSyncFromDom();
  const clean=_CATS.filter(c=>c.name).map(c=>({name:c.name,icon:c.icon||'❓',enabled:c.enabled!==false,order:Number(c.order)||99}));
  try{await api('PATCH','/admin/config',{categories:clean});toast('موضوعات ذخیره شد ✅','ok');await loadCfg();render();}catch(e){toast(e.message,'bad');}
}

let WD_ST='pending', _WD_ROWS={};

async function renderWithdrawals(){
  const d=await api('GET','/admin/wallet/withdrawals?status='+WD_ST+'&pageSize=100');

    '<div class="subtabs">'+Object.keys(st).map(s=>'<button class="'+(WD_ST===s?'active':'')+'" onclick="WD_ST=\''+s+'\';render()">'+st[s]+'</button>').join('')+'</div>'+
    tbl(['کاربر','کد ملی','کارت/شبا مقصد','مبلغ','وضعیت','زمان','عملیات'],(d.rows||[]).map(w=>{
      let a='<button class="btn sm" onclick="wdDetail(\''+w.id+'\')">جزئیات</button>';

      else if(w.status==='approved')a+=' <button class="btn sm info" onclick="wdPaid(\''+w.id+'\')">ثبت پرداخت</button> <button class="btn sm bad" onclick="wdReject(\''+w.id+'\')">رد</button>';
      const user='<a onclick="wdDetail(\''+w.id+'\')" style="cursor:pointer;text-decoration:none"><b>'+esc(w.displayName||w.username||'کاربر')+'</b><br><span class="mono" style="font-size:11px;color:var(--muted)">'+esc(w.phone||String(w.userId).slice(0,8))+'</span></a>';
      return [user,'<span class="mono">'+esc(w.nationalId||'—')+'</span>','<span class="mono" dir="ltr" style="font-size:12px">'+esc(wdFmtDest(w.destination))+'</span>','<b>'+fa(w.amount)+'</b>','<span class="pill '+(w.status==='paid'||w.status==='approved'?'ok':w.status==='rejected'||w.status==='failed'?'bad':'pend')+'">'+(st[w.status]||w.status)+'</span>',fmtDate(w.createdAt),a];

function wdFmtDest(d){
  const s=String(d||'').trim(); if(!s)return '—';
  const digits=s.replace(/\D/g,'');
  if(!s.toUpperCase().startsWith('IR')&&digits.length===16) return digits.replace(/(\d{4})(?=\d)/g,'$1 ');
  return s;
}

  modal('جزئیات درخواست برداشت',
    r('نام کاربر', esc(w.displayName||'—')+(w.username?' <span class="mono" style="color:var(--muted)">@'+esc(w.username)+'</span>':''))+
    r('شماره موبایل','<span class="mono">'+esc(w.phone||'—')+'</span>')+
    r('کد ملی','<span class="mono">'+esc(w.nationalId||'—')+'</span>')+
    r('نام صاحب حساب (بانکی)', esc(w.holderName||'—'))+
    r(String(w.destination||'').toUpperCase().startsWith('IR')?'شماره شبا':'شماره کارت مقصد','<span class="mono" dir="ltr">'+esc(wdFmtDest(w.destination))+'</span>')+
    r('مبلغ درخواستی','<span style="color:var(--gold)">'+fa(w.amount)+' تومان</span>')+
    r('کارمزد', fa(w.fee||0)+' تومان')+
    r('موجودی فعلی کیف پول', w.walletBalance!=null?fa(w.walletBalance)+' تومان':'—')+
    r('وضعیت','<span class="pill '+(w.status==='paid'||w.status==='approved'?'ok':w.status==='rejected'||w.status==='failed'?'bad':'pend')+'">'+(WD_STFA[w.status]||w.status)+'</span>')+

    (w.rejectReason?r('علت رد', esc(w.rejectReason)):'')+
    r('شناسهٔ کاربر','<span class="mono" style="font-size:11px">'+esc(w.userId)+'</span>')+

let RH_ST='pending';
async function renderRewardHolds(){
  const [diag,holds]=await Promise.all([
    api('GET','/admin/rewards/holds/diagnostics').catch(()=>({})),
    api('GET','/admin/rewards/holds?status='+RH_ST+'&limit=200').catch(()=>[])
  ]);
  const list=Array.isArray(holds)?holds:(holds.rows||[]);
  const st={pending:'در انتظار',approved:'تأییدشده',released:'آزادشده',rejected:'ردشده'};
  const money=v=>fa(v)+' ت';
  $('#main').innerHTML=head('جوایز در انتظار','جوایزی که برای بررسی امنیتی پارک شده‌اند — تأیید (واریز) یا رد',
    '<button class="btn sm" onclick="render()">↻ بروزرسانی</button>')+
    '<div class="note">جوایزی که پیش از رفعِ باگ (یا هنگام روشن‌بودنِ بررسیِ امنیتی) پارک شده‌اند اینجا هستند. با «تأیید و واریز»، جایزه از طریقِ ledger به کیف پولِ کاربر واریز و در تراکنش/لیدربورد ثبت می‌شود. بردهای جدید (با تنظیمِ پیش‌فرض) دیگر پارک نمی‌شوند.</div>'+
    '<div class="grid g4" style="margin-bottom:13px">'+
      stat('در انتظار','gold',fa(diag.pending||0))+
      stat('مبلغ در انتظار','gold',money(diag.pendingAmount||0))+
      stat('آزادشده','ok',fa(diag.released||0))+
      stat('ردشده','bad',fa(diag.rejected||0))+
    '</div>'+
    (RH_ST==='pending'&&list.length?'<button class="btn ok" style="margin-bottom:12px" onclick="releaseAllHolds()">✅ تأیید و واریزِ همهٔ '+fa(list.length)+' جایزه</button>':'')+
    '<div class="subtabs">'+Object.keys(st).map(s=>'<button class="'+(RH_ST===s?'active':'')+'" onclick="RH_ST=\''+s+'\';render()">'+st[s]+'</button>').join('')+'</div>'+
    tbl(['کاربر','مسابقه','نوع','مبلغ','ریسک','دلیل','زمان','عملیات'],list.map(h=>[
      '<span class="mono">'+String(h.userId||'').slice(0,8)+'</span>',
      '<span class="mono">'+String(h.matchId||'').slice(0,8)+'</span>',
      esc(h.rewardType||'cash'),'<b style="color:var(--gold)">'+money(h.amount)+'</b>',
      '<b style="color:'+((h.riskScore||0)>=70?'var(--bad)':'var(--gold)')+'">'+fa(h.riskScore||0)+'</b>',
      esc(h.reason||'—'),fmtDate(h.createdAt),
      (h.status==='pending'||h.status==='approved')?'<button class="btn sm ok" onclick="rhAct(\''+h.id+'\',\'approved\')">تأیید و واریز</button> <button class="btn sm bad" onclick="rhAct(\''+h.id+'\',\'rejected\')">رد</button>':'<span class="pill '+(h.status==='released'?'ok':'bad')+'">'+(st[h.status]||h.status)+'</span>'
    ]));
}
async function rhAct(id,status){
  if(status==='rejected'&&!confirm('این جایزه رد شود؟ (به کاربر واریز نمی‌شود)'))return;
  try{await api('PATCH','/admin/rewards/holds/'+id+'/status',{status});toast(status==='approved'?'جایزه واریز شد ✅':'جایزه رد شد','ok');render();}catch(e){toast(e.message,'bad');}
}
async function releaseAllHolds(){
  const holds=await api('GET','/admin/rewards/holds?status=pending&limit=500').catch(()=>[]);
  const list=Array.isArray(holds)?holds:(holds.rows||[]);
  if(!list.length)return toast('موردی برای واریز نیست');
  if(!confirm('همهٔ '+list.length+' جایزهٔ در انتظار تأیید و به کیف پولِ کاربران واریز شود؟'))return;
  let ok=0,bad=0;
  for(const h of list){try{await api('PATCH','/admin/rewards/holds/'+h.id+'/status',{status:'approved'});ok++;}catch(e){bad++;}}
  toast('واریز شد: '+fa(ok)+(bad?' · ناموفق: '+fa(bad):''),bad?'bad':'ok');render();
}

const NT_STFA={pending:'در انتظار',sending:'در حال ارسال',sent:'ارسال شد',canceled:'لغو شد',failed:'ناموفق'};
function ntTypeOptions(sel){const t={system:'عمومی/مهم (همه دریافت می‌کنند)',promo:'تبلیغی (طبق تنظیمات کاربر)',match_update:'مسابقه',wallet_update:'کیف پول',leaderboard_update:'لیدربرد'};return Object.keys(t).map(k=>'<option value="'+k+'"'+(sel===k?' selected':'')+'>'+t[k]+'</option>').join('');}
function ntLocalDefault(){const d=new Date(Date.now()+3600000);d.setSeconds(0,0);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}

function ntSegChange(){const b=$('#seg_base').value;$('#seg_manual_wrap').style.display=b==='manual'?'block':'none';$('#seg_filters').style.display=b==='manual'?'none':'block';}
function ntWhenChange(){const s=document.querySelector('input[name=nt_when]:checked').value;$('#nt_at').style.display=s==='sched'?'inline-block':'none';const g=$('#nt_go');if(g)g.textContent=s==='sched'?'🕒 زمان‌بندی':'📣 ارسال فوری';}
function ntCollectSegment(){
  const base=$('#seg_base').value;
  if(base==='manual'){const ids=($('#seg_uids').value||'').split(',').map(s=>s.trim()).filter(Boolean);return {userIds:ids};}
  const s={};if(base!=='all')s.base=base;
  const plan=$('#seg_plan').value;if(plan)s.plan=plan;
  const st=$('#seg_status').value;if(st)s.status=st;
  const nv2=id=>{const v=$('#'+id).value;return v===''?undefined:Number(v);};
  const minlvl=nv2('seg_minlvl');if(minlvl!=null)s.minLevel=minlvl;
  const maxlvl=nv2('seg_maxlvl');if(maxlvl!=null)s.maxLevel=maxlvl;
  const minxp=nv2('seg_minxp');if(minxp!=null)s.minXp=minxp;
  const wlt=nv2('seg_walletlt');if(wlt!=null)s.walletLt=wlt;
  const wgt=nv2('seg_walletgt');if(wgt!=null)s.walletGt=wgt;
  const tk=$('#seg_tickets').value;if(tk==='yes')s.hasTickets=true;else if(tk==='no')s.hasTickets=false;
  return s;
}
async function ntPreview(){
  try{const seg=ntCollectSegment();const r=await api('POST','/admin/notifications/segment/preview',seg);$('#seg_count').innerHTML='👥 <b style="color:var(--ok,#3c9)">'+fa(r.count||0)+'</b> کاربر — <span style="color:var(--muted)">'+esc(r.description||'')+'</span>';}
  catch(e){toast(e.message,'bad');}
}
async function ntSubmit(testToSelf){
  const title=($('#nt_title')||{}).value?.trim(),body=($('#nt_body')||{}).value?.trim();
  if(!title||!body)return toast('عنوان و متن لازم است','bad');
  const type=$('#nt_type').value,link=$('#nt_link').value,image=($('#nt_image').value||'').trim();
  const action=link?{url:link}:undefined;
  const when=document.querySelector('input[name=nt_when]:checked').value;
  const payload={title,body,type,image:image||undefined,action};
  try{
    if(testToSelf){
      const tid=prompt('آی‌دی کاربرِ آزمایشی (فقط به همین یک نفر ارسال می‌شود):');
      if(!tid||!tid.trim())return;
      const r=await api('POST','/admin/notifications/broadcast',{...payload,segment:{userIds:[tid.trim()]}});
      toast('پیام آزمایشی ارسال شد 🧪 — '+fa(r.audienceCount||0)+' مخاطب','ok');return;
    }
    if(when==='now'){
      const r=await api('POST','/admin/notifications/broadcast',{...payload,segment:seg});
      toast('ارسال شد ✅ — '+fa(r.audienceCount||0)+' مخاطب','ok');NT_TAB='history';render();
    }else{
      const at=$('#nt_at').value;if(!at)return toast('زمان ارسال را انتخاب کن','bad');
      await api('POST','/admin/notifications/schedule',{...payload,segment:seg,scheduledAt:new Date(at).toISOString()});
      toast('زمان‌بندی شد 🕒','ok');NT_TAB='scheduled';render();
    }
  }catch(e){toast(e.message,'bad');}
}

/* ================= QUESTION REPORTS ================= */
let QR_STATUS='open';
const QR_STFA={open:'باز',resolved:'رسیدگی‌شده',dismissed:'رد شده'};
async function renderQReports(){
  let res={rows:[],counts:{open:0,resolved:0,dismissed:0,total:0}};
  try{res=await api('GET','/admin/question-reports?status='+QR_STATUS+'&limit=300');}catch(e){}
  const c=res.counts||{open:0,resolved:0,dismissed:0,total:0};
  const tab=(k,label)=>'<button class="btn sm '+(QR_STATUS===k?'pri':'')+'" onclick="QR_STATUS=\''+k+'\';render()">'+label+'</button>';
  $('#main').innerHTML=head('گزارش سؤالات','گزارش‌هایی که کاربران در حین بازی برای سؤالات ثبت کرده‌اند',
      tab('open','باز ('+fa(c.open)+')')+' '+tab('resolved','رسیدگی‌شده')+' '+tab('dismissed','رد شده')+' '+tab('all','همه'))+
    '<div class="card" style="display:flex;gap:18px;flex-wrap:wrap">'+
      '<div><div class="sub">باز</div><b style="font-size:22px;color:var(--bad,#e66)">'+fa(c.open)+'</b></div>'+
      '<div><div class="sub">رسیدگی‌شده</div><b style="font-size:22px;color:var(--ok,#3c9)">'+fa(c.resolved)+'</b></div>'+
      '<div><div class="sub">رد شده</div><b style="font-size:22px">'+fa(c.dismissed)+'</b></div>'+
      '<div><div class="sub">کل</div><b style="font-size:22px">'+fa(c.total)+'</b></div>'+
    '</div>'+
    '<div class="card"><h3>فهرست گزارش‌ها</h3>'+
      tbl(['سؤال','دلیل','توضیح کاربر','گزارش‌دهنده','زمان','وضعیت','عملیات'],(res.rows||[]).map(r=>{
        const act=r.status==='open'
          ? '<button class="btn sm ok" onclick="qrAct(\''+r.id+'\',\'resolve\')">رسیدگی شد</button> <button class="btn sm" onclick="qrAct(\''+r.id+'\',\'dismiss\')">رد</button> <button class="btn sm" onclick="qrEdit(\''+esc(r.questionId)+'\')">ویرایش سؤال</button>'
          : '<button class="btn sm" onclick="qrEdit(\''+esc(r.questionId)+'\')">ویرایش سؤال</button>';
        const st='<span class="pill '+(r.status==='resolved'?'ok':r.status==='dismissed'?'bad':'pend')+'">'+(QR_STFA[r.status]||r.status)+'</span>';
        const qtext='<div style="max-width:260px">'+esc(r.questionText||'—')+(r.category?'<div class="sub">'+esc(r.category)+'</div>':'')+'</div>';
        return [qtext,esc(r.reasonLabel||r.reason),esc(r.note||'—'),esc((r.userId||'—').slice(0,8)),fmtDate(r.createdAt),st,act];
      }))+
      ((res.rows||[]).length?'':'<div class="empty">گزارشی در این وضعیت نیست.</div>')+'</div>';
}
async function qrAct(id,action){
  try{await api('POST','/admin/question-reports/'+id+'/'+action,{});toast(action==='resolve'?'رسیدگی ثبت شد ✅':'گزارش رد شد','ok');render();}
  catch(e){toast(e.message,'bad');}
}
function qrEdit(qid){
  go('questions');
  // Wait until the questions list has loaded (_QALL populated), then open the edit modal.
  let tries=0;
  const iv=setInterval(()=>{
    tries++;
    const found=(window._QALL||[]).some(x=>x.id===qid);
    if(found){ clearInterval(iv); try{qEdit(qid);}catch(e){} }
    else if(tries>20){ clearInterval(iv); toast('سؤال در فهرست یافت نشد (شاید حذف/بایگانی شده)','bad'); }
  },200);
}

function tabLabelMap(){const m={};NAV.forEach(g=>g[1].forEach(p=>{if(p[0]!=='accounts')m[p[0]]=p[1]+' '+p[2];}));return m;}
function permChecklist(selected){
  const sel=new Set(selected||[]); const all=sel.has('*');
  let html='<label style="display:flex;gap:8px;align-items:center;font-weight:900;margin-bottom:8px"><input type="checkbox" id="perm_all" '+(all?'checked':'')+' onchange="document.querySelectorAll(\'.permchk\').forEach(c=>{c.checked=this.checked;c.disabled=this.checked})"> دسترسی کامل (همهٔ تب‌ها)</label>';
  html+=NAV.map(g=>{
    const items=g[1].filter(p=>p[0]!=='accounts');
    if(!items.length)return '';
    return '<div style="margin:8px 0 3px;color:var(--muted);font-size:11px;font-weight:800">'+g[0]+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">'+

function doReset(area,danger,label){
  if(danger>=1){
    modal('تأییدِ ریست: '+esc(label),
      '<div class="note" style="background:rgba(255,90,72,.12);border-color:rgba(255,90,72,.4);color:#ffb3aa">این عملیات برگشت‌ناپذیر است و «'+esc(label)+'» را برای <b>همهٔ کاربران</b> پاک می‌کند. برای ادامه، کلمهٔ <b>RESET</b> را تایپ کن.</div>'+
      '<div class="field"><label>تأیید نهایی</label><input id="rs_confirm" placeholder="RESET" dir="ltr" autocomplete="off"></div>'+
      '<div class="field"><label>علت (اختیاری)</label><input id="rs_reason" placeholder="مثلاً پاک‌سازی محیطِ تست"></div>'+
      '<button class="btn bad" onclick="doResetConfirmed(\''+area+'\')">اجرای ریست</button>');
  } else {
    if(!confirm('«'+label+'» برای همهٔ کاربران ریست شود؟'))return;
    runReset(area,'RESET','');
  }
}
async function doResetConfirmed(area){
  const c=($('#rs_confirm').value||'').trim();
  if(c!=='RESET')return toast('برای تأیید باید دقیقاً RESET تایپ شود','bad');
  runReset(area,'RESET',($('#rs_reason').value||'').trim());
}
async function runReset(area,confirm,reason){

}

/* ================= GENERIC CONFIG EDITOR (Data-Driven) ================= */
/* Auto-builds an editable form for ANY config subtree, so every variable is
   tunable from the panel. Booleans → checkbox, numbers → number, strings →
   text; nested objects recurse; arrays fall back to the raw-JSON editor. */
async function renderConfigSection(key,title){
  if(!CFG)await loadCfg();
  const node=CFG[key];
  let body;
  if(node==null){ body='<div class="empty">این بخش هنوز در config تعریف نشده.</div>'; }
  else if(Array.isArray(node)||hasArrayDeep(node)){
    body='<div class="note">این بخش شاملِ فهرست/آرایه است؛ برای افزودن آیتم (لیگ، مأموریت، محصول، بنر، رویداد و…) مستقیم اینجا JSON را ویرایش کن. خالی بودن یعنی هنوز موردی تعریف نشده (۰).</div>'+
      '<textarea class="json" id="cfg_arr">'+esc(JSON.stringify(node,null,2))+'</textarea>'+
      '<button class="btn pri" style="margin-top:10px" onclick="saveConfigArray(\''+key+'\')">💾 ذخیره</button>';
  } else {
    _CFG_FIELDS=[];
    body='<div class="card">'+buildFields(node,key)+'<button class="btn pri" style="margin-top:12px" onclick="saveConfigForm(\''+key+'\')">💾 ذخیره</button></div>';
  }
  $('#main').innerHTML=head(title,'Data-Driven — تغییر بلافاصله اعمال و ماندگار می‌شود',
    '<button class="btn" onclick="go(\'rawcfg\')">ویرایش خام کل</button>')+body;
}
let _CFG_FIELDS=[];
function hasArrayDeep(o){ if(Array.isArray(o))return true; if(o&&typeof o==='object')return Object.values(o).some(v=>Array.isArray(v)); return false; }
function buildFields(obj,path){
  let html='';
  for(const k of Object.keys(obj)){
    const v=obj[k]; const p=path+'.'+k;
    if(v!==null&&typeof v==='object'&&!Array.isArray(v)){
      html+='<div style="margin:10px 0 4px;font-weight:800;color:var(--gold);font-size:13px">'+esc(k)+'</div>'+buildFields(v,p);
    }else if(Array.isArray(v)){
      html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+' (آرایه — از ویرایش خام)</span></label><input value="'+esc(JSON.stringify(v))+'" disabled></div>';
    }else{
      const id='cf_'+_CFG_FIELDS.length; _CFG_FIELDS.push({id,path:p,type:typeof v});
      if(typeof v==='boolean')html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+'</span></label><input id="'+id+'" type="checkbox" '+(v?'checked':'')+'></div>';
      else if(typeof v==='number')html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+'</span></label><input id="'+id+'" type="number" value="'+v+'"></div>';
      else html+='<div class="cfg-row"><label>'+esc(k)+'<span class="path">'+esc(p)+'</span></label><input id="'+id+'" value="'+esc(v)+'"></div>';
    }
  }
  return html;
}
function setDeep(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]];}o[ks[ks.length-1]]=val;}
async function saveConfigForm(key){
  const patch={};
  for(const f of _CFG_FIELDS){
    const el=$('#'+f.id);if(!el)continue;
    let val; if(f.type==='boolean')val=el.checked; else if(f.type==='number')val=Number(el.value); else val=el.value;
    setDeep(patch,f.path,val);
  }
  try{await api('PATCH','/admin/config',patch);toast('ذخیره و اعمال شد ✅','ok');await loadCfg();render();}catch(e){toast(e.message||'خطا','bad');}
}
async function saveConfigArray(key){
  let val;try{val=JSON.parse($('#cfg_arr').value);}catch(e){return toast('JSON نامعتبر: '+e.message,'bad');}
  const patch={};patch[key]=val;
  try{await api('PATCH','/admin/config',patch);toast('ذخیره شد ✅','ok');await loadCfg();render();}catch(e){toast(e.message,'bad');}
}
async function renderRawCfg(){
  if(!CFG)await loadCfg();
  $('#main').innerHTML=head('ویرایش خام Config','کلِ تنظیمات بازی — هر متغیری اینجا قابل تغییر است')+
    '<div class="note">این JSON کلِ اقتصاد و بالانسِ بازی است. تغییر و ذخیره → بلافاصله اعمال و در دیتابیس ماندگار می‌شود (بعد از ری‌استارت هم می‌ماند). موارد پیاده‌نشده روی ۰/خالی‌اند و در آپدیت فعال می‌شوند.</div>'+
    '<textarea class="json" id="rawjson" style="min-height:60vh">'+esc(JSON.stringify(CFG,null,2))+'</textarea>'+
    '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn pri" onclick="saveRaw()">💾 ذخیرهٔ کامل</button><button class="btn" onclick="loadCfg().then(render)">بازنشانی</button></div>';
}
async function saveRaw(){
  let obj;try{obj=JSON.parse($('#rawjson').value);}catch(e){return toast('JSON نامعتبر: '+e.message,'bad');}
  try{await api('PUT','/admin/config',obj);toast('کل تنظیمات ذخیره شد ✅','ok');await loadCfg();render();}catch(e){toast(e.message||'ذخیره ناموفق (بررسی ساختار modes/economy)','bad');}
}
