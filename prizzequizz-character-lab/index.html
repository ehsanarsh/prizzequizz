<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFD21F" />
  <title>PrizzeQuizz Character Lab</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preload" href="./assets/states/idle.png" as="image" />
  <style>
    :root {
      --ink: #0d0d10;
      --ink-2: #17171c;
      --ink-3: #24242b;
      --paper: #f7f4ec;
      --bolt: #ffd21f;
      --bolt-2: #f5b90d;
      --sky: #55c9f5;
      --ok: #33d97c;
      --bad: #ff5a48;
      --muted: #b9b4a6;
      --line: rgba(247,244,236,.12);
      --stroke: 2.5px solid #000;
      --hard: 0 5px 0 #000;
      --hard-sm: 0 3px 0 #000;
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(80% 55% at 50% 0%, rgba(255,210,31,.18), transparent 48%),
        linear-gradient(180deg, #181612, #070708);
      color: var(--paper);
      display: grid;
      place-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app {
      width: min(430px, 100%);
      min-height: min(850px, 100svh - 32px);
      background: linear-gradient(180deg, #222018, #101012);
      border: var(--stroke);
      border-radius: 34px;
      box-shadow: 0 30px 80px rgba(0,0,0,.65), var(--hard);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent);
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--bolt), var(--bolt-2));
      color: #141414;
      border: var(--stroke);
      display: grid;
      place-items: center;
      font-size: 24px;
      box-shadow: var(--hard-sm);
      flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 900; }
    .brand small { display: block; color: var(--muted); margin-top: 3px; font-size: 11px; font-weight: 800; }

    .install {
      border: var(--stroke);
      border-radius: 14px;
      background: var(--ink-2);
      color: var(--paper);
      padding: 10px 12px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      box-shadow: var(--hard-sm);
      cursor: pointer;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 16px;
      min-height: 0;
    }

    .preview-card {
      background: radial-gradient(circle at 50% 28%, rgba(255,210,31,.18), rgba(255,255,255,.04) 42%, rgba(0,0,0,.24) 100%);
      border: var(--stroke);
      border-radius: 26px;
      padding: 14px;
      box-shadow: var(--hard), inset 0 1px 0 rgba(255,255,255,.08);
      min-height: 360px;
      position: relative;
      overflow: hidden;
    }
    .preview-card::before {
      content: "";
      position: absolute;
      inset: -55%;
      background: conic-gradient(from 0deg, transparent 0 25deg, rgba(255,210,31,.08) 25deg 42deg, transparent 42deg 76deg);
      animation: spin 18s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .character-stage {
      position: relative;
      z-index: 1;
      width: min(100%, 330px);
      aspect-ratio: 560 / 680;
      margin: 0 auto;
      filter: drop-shadow(0 20px 18px rgba(0,0,0,.45));
      transform-origin: center bottom;
      animation: idle 3s ease-in-out infinite;
    }
    @keyframes idle { 50% { transform: translateY(-4px); } }

    .character-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }
    .character-stage [data-layer="base"] { z-index: 1; }
    .character-stage [data-layer="body"] { z-index: 2; }
    .character-stage [data-layer="shoes"] { z-index: 3; }
    .character-stage [data-layer="head"] { z-index: 4; }

    .meta-card {
      position: relative;
      z-index: 2;
      margin-top: 10px;
      background: rgba(0,0,0,.34);
      border: 2px solid #000;
      border-radius: 18px;
      padding: 11px 13px;
      display: grid;
      gap: 4px;
    }
    .meta-card b { color: var(--bolt); }
    .meta-card span { color: var(--muted); font-size: 12px; line-height: 1.6; font-weight: 750; }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.18));
      border: var(--stroke);
      border-radius: 24px;
      padding: 14px;
      box-shadow: var(--hard-sm);
      min-height: 0;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      margin: 0 0 9px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .choice-card, .slot-tab {
      border: var(--stroke);
      border-radius: 17px;
      min-height: 58px;
      background: var(--ink-2);
      color: var(--paper);
      font: inherit;
      cursor: pointer;
      box-shadow: var(--hard-sm);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: start;
      transition: transform .12s ease, background .18s ease, filter .18s ease;
    }
    .choice-card:active, .slot-tab:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    .choice-card.is-active, .slot-tab.is-active {
      background: linear-gradient(180deg, #ffe24a, var(--bolt-2));
      color: #141414;
    }
    .choice-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 2px solid #000;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      flex: 0 0 auto;
      font-size: 18px;
    }
    .choice-card.is-active .choice-icon, .slot-tab.is-active .choice-icon { background: rgba(0,0,0,.12); }
    .choice-copy { min-width: 0; }
    .choice-copy b { display: block; font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .choice-copy small { display: block; font-size: 10px; opacity: .72; margin-top: 2px; direction: ltr; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .outfit-area {
      max-height: 252px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 1px 6px;
    }
    .outfit-area::-webkit-scrollbar { width: 0; height: 0; }

    .footer-actions {
      display: flex;
      gap: 10px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .primary, .ghost {
      flex: 1;
      border: var(--stroke);
      border-radius: 17px;
      padding: 13px 14px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--hard-sm);
    }
    .primary { background: linear-gradient(180deg, #ffe24a, var(--bolt-2)); color: #141414; }
    .ghost { background: var(--ink-2); color: var(--paper); }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--ink);
      z-index: 10;
      transition: opacity .25s ease, visibility .25s ease;
      font-weight: 900;
      color: var(--bolt);
    }
    body.is-ready .loading { opacity: 0; visibility: hidden; }

    @media (max-width: 380px) {
      body { padding: 0; }
      .app { min-height: 100svh; border-radius: 0; border: none; }
      main { padding: 12px; gap: 11px; }
      .preview-card { min-height: 315px; border-radius: 22px; }
      .grid { grid-template-columns: 1fr; }
      .choice-card, .slot-tab { min-height: 54px; }
      header { padding-inline: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="loading">در حال بارگذاری کاراکتر...</div>

    <header>
      <div class="brand">
        <div class="badge">👾</div>
        <div>
          <h1>Character Lab</h1>
          <small>PrizzeQuizz PWA · Layered 2D</small>
        </div>
      </div>
      <button id="installButton" class="install" hidden>نصب PWA</button>
    </header>

    <main>
      <section class="preview-card" aria-label="Live character preview">
        <div id="characterPreview" class="character-stage">
          <img data-layer="base" alt="base character" />
          <img data-layer="body" alt="body outfit" />
          <img data-layer="shoes" alt="shoes outfit" />
          <img data-layer="head" alt="head outfit" />
        </div>
        <div class="meta-card">
          <b id="currentState">—</b>
          <span id="currentOutfit">—</span>
        </div>
      </section>

      <section class="panel" aria-label="Character controls">
        <p class="section-title">State Selection</p>
        <div id="stateGrid" class="grid"></div>
      </section>

      <section class="panel" aria-label="Outfit controls">
        <p class="section-title">Outfit Slots</p>
        <div id="slotTabs" class="tabs"></div>
        <div id="outfitGrid" class="grid outfit-area"></div>
      </section>

      <div class="footer-actions">
        <button id="resetButton" class="ghost">ریست</button>
        <button class="primary" onclick="document.querySelector('[data-layer=base]').animate([{transform:'scale(.96)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.2,1.3,.4,1)'})">تست واکنش</button>
      </div>
    </main>
  </div>

  <script type="module" src="./js/character.js"></script>
</body>
</html>
