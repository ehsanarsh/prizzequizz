services:
  postgres:
    image: postgres:16-alpine
    # Every service restarts by itself. Without this, any reboot — including the
    # one a VPS does when its plan is resized — leaves nginx up with nothing
    # behind it, and the whole site answers 502 until someone logs in by hand.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prizzequizz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prizzequizz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./prizzequizz-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      API_BASE_PATH: /v1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/prizzequizz
      REDIS_URL: redis://redis:6379
      REPOSITORY_DRIVER: postgres
      REALTIME_ADAPTER: redis
      LEADERBOARD_ADAPTER: redis
      PUSH_PROVIDER: log
      REWARD_HOLD_ENABLED: "true"
      PAYMENT_PROVIDER: sandbox
      MATCHMAKING_ADAPTER: memory
      MATCHMAKING_WORKER: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pwa:
    build: ./prizzequizz-pwa
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000/v1
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  pgdata:
