# Builds the Android app and hands back an installable APK and an AAB.
#
# It runs on GitHub's machines because they already have the Android SDK; the
# alternative is installing ~2GB of tooling on a laptop to produce one file.
#
# Run it from the repository's Actions tab: "Build Android app" → Run workflow.
#
# SIGNING. Cafe Bazaar will only accept a RELEASE-signed build, and every
# future update must be signed with the SAME key — lose it and the listing can
# never be updated again. So the key is not in this repository and never should
# be: the workflow reads it from repository secrets, and if they are absent it
# still produces a debug APK you can install and try on a phone.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version shown in the store (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      versionCode:
        description: 'Version code — must increase with every upload'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    # The `secrets` context cannot be used in an `if:` condition, so it is read
    # into the environment once and the conditions test that instead.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # A pinned Gradle, rather than whatever the runner ships. The runner's
      # Gradle is 9.x, which the Android plugin 8.5.2 cannot be evaluated by —
      # the build failed on the first line it read.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Present only when the three secrets are set. Absent → debug build.
      - name: Restore the signing key
        id: keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pz.jks"
          echo "path=$RUNNER_TEMP/pz.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB + APK
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          gradle --no-daemon bundleRelease assembleRelease \
            -PpzKeystore="${{ steps.keystore.outputs.path }}" \
            -PpzStorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PpzKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PpzKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -PpzVersionName="${{ inputs.versionName }}" \
            -PpzVersionCode="${{ inputs.versionCode }}"

      - name: Build a debug APK (no signing key configured)
        if: env.KEYSTORE_B64 == ''
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # The fingerprint that must appear in assetlinks.json on the domain.
      # Without it Android shows a URL bar and the app looks like a browser.
      - name: Print the signing fingerprint for assetlinks.json
        if: env.KEYSTORE_B64 != ''
        run: |
          keytool -list -v -keystore "${{ steps.keystore.outputs.path }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -A1 'SHA256:' || true

      - uses: actions/upload-artifact@v4
        with:
          name: prizzequizz-android
          retention-days: 30
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
