# Serve the Digital Asset Links file. Without this Android cannot verify that
# the app is allowed to show prizequiz.ir full-screen, and it draws a URL bar
# across the top — the app then looks like a browser with the game inside it.
#
# Add inside the `server { ... }` block that already serves prizequiz.ir over
# HTTPS in /etc/nginx/sites-enabled/prizequiz (or wherever it lives), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify with:
#   curl -s https://prizequiz.ir/.well-known/assetlinks.json
# It must answer with JSON and content-type application/json.

location = /.well-known/assetlinks.json {
    alias /var/www/prizequiz/.well-known/assetlinks.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=300";
}
